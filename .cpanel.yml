# cPanel Git™ Version Control deployment for grafverse.com — the integrated first-person game.
# In cPanel → Git Version Control: "Update from Remote" then "Deploy HEAD Commit".
# DEPLOYPATH = the grafverse.com document root, relative to $HOME (mirrors bitgraf.com → $HOME/bitgraf.com/).
deployment:
  tasks:
    - export DEPLOYPATH="$HOME/grafverse.com/"
    - /bin/cp grafverse.html "$DEPLOYPATH/index.html"    # the integrated first-person game (onboarding → manifest → paint-to-earn)
    - /bin/cp og.jpg "$DEPLOYPATH"                        # social / link-preview card
    - /bin/cp -r vendor "$DEPLOYPATH"                     # vendored three.min.js + grafmint.js (offline, no CDN)
    - /bin/cp -r wallet "$DEPLOYPATH"                     # wallet/immortalize app — TESTING at /wallet/ for now;
                                                          # real home is the wallet.grafverse.com SUBDOMAIN (key isolation)
    - /bin/cp handoff.php "$DEPLOYPATH"                   # transient game→wallet atom bridge (POST bytes → id → GET)
    - /bin/cp world.php "$DEPLOYPATH"                     # persistent public store for shared FREE worlds (POST .bmf → short id → GET; 12-mo no-view expiry)
    - /bin/cp w.php "$DEPLOYPATH"                         # shareable, crawlable OG/SEO landing page per shared world (→ ./?w=<id>)
    - /bin/cp bmf-codec.js "$DEPLOYPATH"                  # shared thrifty BMF pack/unpack codec (game packs before mint)
