# cPanel Git™ Version Control deployment for grafverse.com — the integrated first-person game.
# In cPanel → Git Version Control: "Update from Remote" then "Deploy HEAD Commit".
# DEPLOYPATH = the grafverse.com document root, relative to $HOME (mirrors bitgraf.com → $HOME/bitgraf.com/).
deployment:
  tasks:
    - export DEPLOYPATH="$HOME/grafverse.com/"
    - /bin/cp grafverse.html "$DEPLOYPATH/index.html"    # the integrated first-person game (onboarding → manifest → paint-to-earn)
    - /bin/cp og.jpg "$DEPLOYPATH"                        # social / link-preview card
    - /bin/cp merch-ad.jpg "$DEPLOYPATH"                  # ⏻ Exit merch-ad artwork (grafverse hero)
    - /bin/cp grafverse-splash.jpg "$DEPLOYPATH"          # entry/splash background (from the #05 hero)
    - /bin/cp -r vendor "$DEPLOYPATH"                     # vendored three.min.js + grafmint.js (offline, no CDN)
    # WALLET → its OWN isolated subdomain docroot (served ONLY at wallet.grafverse.com, NEVER grafverse.com/wallet/ — key isolation).
    # Only index.html goes here; it pulls bmf-codec.js / grafmint.js / handoff.php from grafverse.com cross-origin (CORS-allowed).
    - export WALLETPATH="$HOME/wallet.grafverse.com"     # mirrors $HOME/grafverse.com/ — if cPanel's actual docroot differs, change this ONE path
    - /bin/mkdir -p "$WALLETPATH" && /bin/cp wallet/index.html "$WALLETPATH/index.html" && echo "wallet → $WALLETPATH/index.html"
    - /bin/cp wallet/jsqr.min.js "$WALLETPATH/jsqr.min.js"    # vendored QR decoder — lazy-loaded same-origin for the 📷 Send-address scanner (jsQR fallback where BarcodeDetector is absent)
    - /bin/cp handoff.php "$DEPLOYPATH"                   # transient game→wallet atom bridge (POST bytes → id → GET)
    - /bin/cp world.php "$DEPLOYPATH"                     # persistent public store for shared FREE worlds (POST .bmf → short id → GET; 12-mo no-view expiry)
    - /bin/cp w.php "$DEPLOYPATH"                         # shareable, crawlable OG/SEO landing page per shared world/solid (→ ./?w=<id>)
    - /bin/cp og.php "$DEPLOYPATH"                        # serves a share's rendered 1200×630 OG cover (falls back to og.jpg)
    - /bin/cp bmf-codec.js "$DEPLOYPATH"                  # shared thrifty BMF pack/unpack codec (game packs before mint)
    - /bin/cp stars.js "$DEPLOYPATH"                      # sky data pack (loaded by the game backdrop)
    - /bin/cp milkyway.webp "$DEPLOYPATH"                 # all-sky backdrop image
    - /bin/cp lang-*.js "$DEPLOYPATH"                     # i18n language packs (lang-ja.js, lang-zh-Hant.js, …) lazy-loaded by the game
    - /bin/cp brc226.html "$DEPLOYPATH"                   # BRC-226 blueprint — self-contained, crawlable (coined-term SEO); shareable at grafverse.com/brc226.html
    - /bin/cp tip.php "$DEPLOYPATH"                        # BRC-226 LiveCounter board cache: follows the covenant chain → { n, tipTxid, last21[] }
