<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grafverse — conjure, build &amp; paint</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;background:#070a14;overflow:hidden;font-family:system-ui,sans-serif;color:#eaf2ff;user-select:none;-webkit-user-select:none}
  canvas{display:block;touch-action:none}
  #hud{position:fixed;left:16px;top:14px;font-size:13px;line-height:1.5;color:#9fb4d8;pointer-events:none;text-shadow:0 1px 4px #000;max-width:60vw}
  #hud b{color:#eaf2ff}
  #status{color:#8fe0b0;font-size:12px;margin-top:3px;min-height:1.2em}
  #save{position:fixed;right:16px;top:14px;padding:9px 14px;border-radius:12px;background:rgba(20,44,36,.92);
        border:1px solid rgba(120,255,190,.4);color:#dfff0e8;font:600 13px system-ui;cursor:pointer}
  #save:active{background:rgba(40,120,90,.95)}
  #palette{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:96vw}
  .p{padding:10px 14px;border-radius:14px;background:rgba(20,40,74,.92);border:1px solid rgba(120,170,255,.4);
     color:#dfeaff;font:600 13px system-ui;cursor:pointer}
  .p:active{background:rgba(56,120,210,.95)}
  #tools{position:fixed;right:16px;bottom:16px;display:none;flex-direction:column;gap:7px;align-items:flex-end}
  .row{display:flex;gap:6px;align-items:center;background:rgba(10,18,32,.7);padding:5px 8px;border-radius:12px}
  .row span{font:700 12px system-ui;color:#bcd0f0;width:20px;text-align:center}
  .b{width:40px;height:40px;border-radius:10px;background:rgba(24,46,82,.95);border:1px solid rgba(120,170,255,.45);
     color:#eaf6ff;font:700 20px system-ui;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .b.del{background:rgba(150,60,70,.9);border-color:rgba(235,150,160,.5);font-size:16px}
  .b.paint{background:rgba(30,90,70,.95);border-color:rgba(120,255,190,.5);font-size:18px}
  /* paint mode */
  #paintbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:none;flex-direction:column;gap:10px;align-items:center}
  #swatches{display:flex;gap:10px}
  .c{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;transition:transform .12s,border-color .12s}
  .c.on{border-color:#fff;transform:scale(1.22)}
  #nozzles{display:flex;gap:8px}
  .n{padding:8px 14px;border-radius:12px;background:rgba(18,36,68,.9);border:1px solid rgba(120,170,255,.4);
     color:#cfe0ff;font:600 12px system-ui;letter-spacing:.06em;cursor:pointer}
  .n.on{background:rgba(56,120,210,.95);border-color:#fff;color:#fff}
  #done{padding:10px 24px;border-radius:14px;background:rgba(30,90,70,.95);border:1px solid rgba(120,255,190,.5);
        color:#dfffe8;font:700 14px system-ui;cursor:pointer}
  #done:active{background:rgba(40,140,100,.95)}
  body.painting #palette, body.painting #tools{display:none!important}
  body.painting #paintbar{display:flex}
</style>
</head>
<body>
<div id="hud">
  <b>grafverse · conjure, build &amp; paint</b><br>
  <span id="hudtip">tap a shape to conjure · tap any shape to select · drag to move (it stacks &amp; falls) · right-drag orbit · scroll zoom · <b>🎨</b> paint the selected shape</span>
  <div id="status"></div>
</div>
<div id="save">💾 Save</div>
<div id="palette"></div>
<div id="tools"></div>
<div id="paintbar">
  <div id="swatches"></div>
  <div id="nozzles"></div>
  <div id="done">✓ Done painting</div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
  "use strict";
  if(!window.THREE){ document.getElementById('status').textContent='vendor/three.min.js not found'; return; }

  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);
  const el=renderer.domElement;

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x070a14);
  scene.add(new THREE.AmbientLight(0x445577,0.9));
  const key=new THREE.DirectionalLight(0xcdd8ff,0.7); key.position.set(5,10,6); scene.add(key);
  const rim=new THREE.DirectionalLight(0x24365e,0.5); rim.position.set(-5,3,-4); scene.add(rim);
  scene.add(new THREE.GridHelper(40,40,0x24406b,0x162a49));
  const groundPlane=new THREE.Mesh(new THREE.PlaneGeometry(400,400).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({visible:false}));
  scene.add(groundPlane);

  const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,500);
  const target=new THREE.Vector3(0,1.2,0);
  let theta=0.7, phi=1.05, radius=12;
  function updateCam(){ camera.position.set(
      target.x+radius*Math.sin(phi)*Math.sin(theta), target.y+radius*Math.cos(phi),
      target.z+radius*Math.sin(phi)*Math.cos(theta)); camera.lookAt(target); }
  updateCam();

  // ---------- shape kit (bottom at y=0 so shapes sit on the ground) ----------
  const TEX=1024;
  function paintCanvas(){ const c=document.createElement('canvas'); c.width=c.height=TEX; c.getContext('2d').clearRect(0,0,TEX,TEX); return c; }
  function coneDiskUV(geo,H){                 // unwrap the cone SIDE as a disk (apex→centre): kills per-segment seams
    const g0=geo.groups[0], idx=geo.index, pos=geo.attributes.position, uv=geo.attributes.uv, done=new Set();
    for(let i=g0.start;i<g0.start+g0.count;i++){ const vi=idx.getX(i); if(done.has(vi))continue; done.add(vi);
      const x=pos.getX(vi),y=pos.getY(vi),z=pos.getZ(vi), t=(y+H/2)/H, a=Math.atan2(z,x), rho=(1-t)*0.49;
      uv.setXY(vi, 0.5+rho*Math.cos(a), 0.5+rho*Math.sin(a)); }
    uv.needsUpdate=true;
  }
  const BASE={ plane:{w:2,d:2}, wall:{w:2,h:2.4,t:0.15}, box:{w:1.4,h:1.4,d:1.4}, cylinder:{r:0.7,h:1.6}, sphere:{r:0.9}, cone:{r:0.9,h:1.7}, pyramid:{r:1.0,h:0.9} };  // pyramid ≈ Great Pyramid of Giza (h/base ≈ 0.636, slope ≈ 51.84°)
  function geomFor(type,p){ p=p||BASE[type]||{};
    switch(type){
      case 'plane':    return new THREE.PlaneGeometry(p.w||2, p.d||2).rotateX(-Math.PI/2);
      case 'wall':     return new THREE.BoxGeometry(p.w||2, p.h||2.4, p.t||0.15).translate(0,(p.h||2.4)/2,0);
      case 'box':      return new THREE.BoxGeometry(p.w||1.4,p.h||1.4,p.d||1.4).translate(0,(p.h||1.4)/2,0);
      case 'cylinder': return new THREE.CylinderGeometry(p.r||0.7,p.r||0.7,p.h||1.6,40).translate(0,(p.h||1.6)/2,0);
      case 'sphere':   return new THREE.SphereGeometry(p.r||0.9,40,28).translate(0,p.r||0.9,0);
      case 'cone':     { const cg=new THREE.ConeGeometry(p.r||0.9,p.h||1.7,40); coneDiskUV(cg,p.h||1.7); return cg.translate(0,(p.h||1.7)/2,0); }
      case 'pyramid':  { const H=p.h||1.6, pg=new THREE.ConeGeometry(p.r||1.0,H,4).rotateY(Math.PI/4); coneDiskUV(pg,H); return pg.translate(0,H/2,0); }
    } return new THREE.BoxGeometry(1,1,1);
  }
  const AXES={
    box:      [['W','x'],['H','y'],['D','z']],
    wall:     [['W','x'],['H','y'],['T','z']],
    plane:    [['W','x'],['D','z']],
    cylinder: [['R','xz'],['H','y']],
    cone:     [['R','xz'],['H','y']],
    pyramid:  [['R','xz'],['H','y']],
    sphere:   [['Size','xyz']],
  };
  function ghostMesh(type){
    const geo=geomFor(type);
    const m=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:0x13203a, transparent:true, opacity:0.5,
      roughness:.7, metalness:.1, emissive:0x1a2c50, emissiveIntensity:.5, side:THREE.DoubleSide }));
    const edge=new THREE.LineSegments(new THREE.EdgesGeometry(geo,32),
      new THREE.LineBasicMaterial({color:0x5fa0e0,transparent:true,opacity:0.6}));
    m.add(edge);
    m.userData={ type, target:new THREE.Vector3(1,1,1), grow:0, edge, surfaces:null };
    return m;
  }
  // convert a ghost into a paintable atom: one CanvasTexture per surface (indexed by materialIndex)
  function solidify(mesh){
    if(mesh.userData.surfaces) return;
    const geo=mesh.geometry, hasGroups=geo.groups.length>0;
    const used=hasGroups?geo.groups.map(g=>g.materialIndex):[0], maxMi=Math.max(0,...used);
    const surfaces=[], mats=[];
    for(let mi=0; mi<=maxMi; mi++){ const cvs=paintCanvas();
      const tex=new THREE.CanvasTexture(cvs); tex.anisotropy=4;
      surfaces[mi]={cvs, ctx:cvs.getContext('2d'), tex, strokes:[]};
      mats[mi]=new THREE.MeshStandardMaterial({ color:0x0c1526, transparent:true, opacity:0.5, roughness:.75,
        metalness:.1, emissive:0xffffff, emissiveMap:tex, emissiveIntensity:1.0, side:THREE.DoubleSide }); }
    mesh.material = hasGroups?mats:mats[0];
    mesh.userData.surfaces=surfaces;
  }
  function materialize(mesh){                 // first fleck of paint: stop being a transparent ghost, become solid
    if(mesh.userData.painted) return; mesh.userData.painted=true;
    (Array.isArray(mesh.material)?mesh.material:[mesh.material]).forEach(mt=>{ mt.transparent=false; mt.opacity=1; mt.needsUpdate=true; });
  }

  // ---------- spray engine (distance-driven cone + running drips) ----------
  const COLORS=[0x38e1ff,0xff3ea5,0x7CFC00,0xffe94d,0xff7a00,0xffffff];
  const NEAR=4.5, FAR=16;
  const NOZZLES=[
    {name:'skinny', r:20, spread:1.6, drip:true},
    {name:'fat',    r:42, spread:2.6, drip:true},
    {name:'fine',   r:15, spread:0.7, drip:false},
  ];
  let nozIdx=1, colorIdx=0;
  const drips=[];
  function rgb(i){ const c=new THREE.Color(COLORS[i]); return [c.r*255|0,c.g*255|0,c.b*255|0]; }
  const _n=new THREE.Vector3(),_rd=new THREE.Vector3(),_tU=new THREE.Vector3(),_tV=new THREE.Vector3(),_ip=new THREE.Vector3(),_wd=new THREE.Vector3();
  const _pA=new THREE.Vector3(),_pB=new THREE.Vector3(),_pC=new THREE.Vector3(),_e1=new THREE.Vector3(),_e2=new THREE.Vector3();
  function uvTangent(h,out){
    const geo=h.object.geometry,pos=geo.attributes.position,uva=geo.attributes.uv,f=h.face;
    if(!uva||!f){ out.set(1,0,0); return out; }
    _pA.fromBufferAttribute(pos,f.a); _pB.fromBufferAttribute(pos,f.b); _pC.fromBufferAttribute(pos,f.c);
    const ua=uva.getX(f.a),va=uva.getY(f.a),ub=uva.getX(f.b),vb=uva.getY(f.b),uc=uva.getX(f.c),vc=uva.getY(f.c);
    _e1.copy(_pB).sub(_pA); _e2.copy(_pC).sub(_pA);
    const r=1/(((ub-ua)*(vc-va)-(uc-ua)*(vb-va))||1e-6);
    out.copy(_e1).multiplyScalar((vc-va)*r).addScaledVector(_e2,-(vb-va)*r);
    out.transformDirection(h.object.matrixWorld);
    if(out.lengthSq()<1e-8) out.set(1,0,0); else out.normalize();
    return out;
  }
  function spray(surface, h, dwell){
    const ctx=surface.ctx, uv=h.uv, x=uv.x*TEX, y=(1-uv.y)*TEX, N=NOZZLES[nozIdx];
    const dist=camera.position.distanceTo(h.point);
    _n.copy(h.face.normal).transformDirection(h.object.matrixWorld).normalize();
    _rd.copy(h.point).sub(camera.position).normalize();
    const inc=Math.min(1,Math.abs(_rd.dot(_n)));
    uvTangent(h,_tU); _tV.crossVectors(_n,_tU).normalize();
    _ip.copy(_rd).addScaledVector(_n,-_rd.dot(_n));
    if(_ip.lengthSq()<1e-9) _ip.copy(_tU);
    _ip.normalize();
    let angle=Math.atan2(-_ip.dot(_tV), _ip.dot(_tU));
    let stretch=Math.min(2.4, 1/Math.max(inc,0.4));
    if(!isFinite(angle)) angle=0; if(!isFinite(stretch)||stretch<1) stretch=1;
    const dn=Math.max(0,Math.min(1,(dist-NEAR)/(FAR-NEAR)));
    const R=N.r*(0.55+dn*N.spread), core=0.62*(1-dn*0.6)/Math.sqrt(stretch);
    const c=rgb(colorIdx), cr=c[0], cg=c[1], cb=c[2];
    ctx.globalCompositeOperation='lighter';
    ctx.save(); ctx.translate(x,y); ctx.rotate(angle); ctx.scale(stretch,1);
    const g=ctx.createRadialGradient(0,0,0,0,0,R);
    g.addColorStop(0,`rgba(${cr},${cg},${cb},${core})`); g.addColorStop(0.5,`rgba(${cr},${cg},${cb},${core*0.35})`); g.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill(); ctx.restore();
    const drops=((4+(dn*44|0))*(N.spread/2.6))|0, ca=Math.cos(angle), sa=Math.sin(angle);
    for(let i=0;i<drops;i++){ const a=Math.random()*7, base=Math.random()*R*(1.1+dn*1.6);
      const ox=Math.cos(a)*base*stretch, oy=Math.sin(a)*base, rr=1+Math.random()*(2+dn*4);
      ctx.fillStyle=`rgba(${cr},${cg},${cb},${(0.10+Math.random()*0.22)*(1-dn*0.4)})`;
      ctx.beginPath(); ctx.arc(x+ox*ca-oy*sa, y+ox*sa+oy*ca, rr, 0,7); ctx.fill(); }
    ctx.globalCompositeOperation='source-over';
    surface.tex.needsUpdate=true;
    if(N.drip){ const vertical=Math.abs(_n.y)<0.55, run=(1-dn)*dwell;
      if(vertical && run>0.55 && Math.random()<0.14){
        let dcx=0,dcy=1; const type=h.object.userData.type;
        if((type==='cone'||type==='pyramid') && (h.face.materialIndex||0)===0){    // disk-unwrapped side: down the slope = radially OUTWARD from centre
          const rx=x-TEX/2, ry=y-TEX/2, rl=Math.hypot(rx,ry)||1; dcx=rx/rl; dcy=ry/rl;
        } else {
          _wd.set(0,-1,0).addScaledVector(_n,_n.y);       // flat face: world-down projected onto the surface
          if(_wd.lengthSq()>1e-6){ _wd.normalize(); const du=_wd.dot(_tU),dv=_wd.dot(_tV),dl=Math.hypot(du,dv)||1; dcx=du/dl; dcy=-dv/dl; }
        }
        drips.push({surface, x, y, dx:dcx, dy:dcy, len:0, maxLen:30+Math.random()*140, w:2.5+Math.random()*4.5, col:colorIdx}); } }
  }
  function stepDrips(){
    for(let i=drips.length-1;i>=0;i--){ const d=drips[i], ctx=d.surface.ctx, c=rgb(d.col);
      ctx.globalCompositeOperation='lighter';
      if(d.len<d.maxLen){ const nl=Math.min(d.maxLen,d.len+2.6);
        ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},0.5)`; ctx.lineWidth=d.w; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(d.x+d.dx*d.len, d.y+d.dy*d.len); ctx.lineTo(d.x+d.dx*nl, d.y+d.dy*nl); ctx.stroke();
        d.len=nl;
      } else { ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},0.55)`;
        ctx.beginPath(); ctx.arc(d.x+d.dx*d.len, d.y+d.dy*d.len, d.w*0.95,0,7); ctx.fill(); drips.splice(i,1); }
      ctx.globalCompositeOperation='source-over'; d.surface.tex.needsUpdate=true;
    }
  }

  // ---------- stroke recording (the mint-ready paint data) ----------
  let cur=null;
  function startStroke(h){
    solidify(h.object);                        // lazy: the first spray is what creates the paint surfaces
    const si=h.face.materialIndex||0;
    cur={ atom:h.object, si, surface:h.object.userData.surfaces[si], t0:performance.now(),
          dwell:0, lu:null, lv:null, stroke:{ b:'solid', noz:NOZZLES[nozIdx].name, c:colorIdx, s:NOZZLES[nozIdx].r, pts:[] } };
    materialize(h.object);                     // first fleck: ghost → solid, and it can never go back
    addPoint(h);
  }
  function addPoint(h){
    if(!cur) return;
    const uv=h.uv;
    const moved=cur.lu!=null?Math.hypot(uv.x-cur.lu,uv.y-cur.lv):1;
    cur.dwell = moved<0.012 ? Math.min(1,cur.dwell+0.09) : Math.max(0,cur.dwell-0.16);
    spray(cur.surface, h, cur.dwell);
    const pts=cur.stroke.pts;
    if(pts.length && moved<0.006) return;
    pts.push([ +uv.x.toFixed(3), +uv.y.toFixed(3), Math.round(performance.now()-cur.t0) ]);
    cur.lu=uv.x; cur.lv=uv.y;
  }
  function simplify(pts, eps){
    if(pts.length<3) return pts;
    const keep=new Array(pts.length).fill(false); keep[0]=keep[pts.length-1]=true; const stack=[[0,pts.length-1]];
    while(stack.length){ const s=stack.pop(),a=s[0],b=s[1],ax=pts[a][0],ay=pts[a][1],dx=pts[b][0]-ax,dy=pts[b][1]-ay,l2=dx*dx+dy*dy||1e-9;
      let md=0,idx=-1; for(let i=a+1;i<b;i++){ const px=pts[i][0],py=pts[i][1],tt=((px-ax)*dx+(py-ay)*dy)/l2,cx=ax+tt*dx,cy=ay+tt*dy,dd=Math.hypot(px-cx,py-cy); if(dd>md){md=dd;idx=i;} }
      if(md>eps&&idx>0){ keep[idx]=true; stack.push([a,idx]); stack.push([idx,b]); } }
    return pts.filter((_,i)=>keep[i]);
  }
  function endStroke(){ if(cur&&cur.stroke.pts.length){ cur.stroke.pts=simplify(cur.stroke.pts,0.009); cur.surface.strokes.push(cur.stroke); } cur=null; }

  // ---------- scene shapes + arrange (gravity stacking) ----------
  const shapes=[]; let active=null, paintMode=false;
  const LAST={};   // last-used size/rotation per shape type — new ghosts of that type inherit it
  const _b=new THREE.Box3(), _ab=new THREE.Box3();
  function boundsOf(mesh,box){ const g=mesh.geometry; if(!g.boundingBox) g.computeBoundingBox();
    mesh.updateMatrixWorld(true); return box.copy(g.boundingBox).applyMatrix4(mesh.matrixWorld); }
  function eng(aMin,aMax,bMin,bMax){ const o=Math.min(aMax,bMax)-Math.max(aMin,bMin);
    return o > Math.min(0.5, 0.5*Math.min(aMax-aMin,bMax-bMin)) - 1e-4; }
  function settle(mesh,lift){
    if(mesh.userData.painted || mesh.userData.freeY) return;  // painted = fixed; freeY = manually placed (embedded), gravity leaves it alone
    boundsOf(mesh,_ab); let top=0;
    for(const m of shapes){ if(m===mesh || !m.userData.painted) continue;   // only PAINTED shapes bear weight
      boundsOf(m,_b);
      if(eng(_ab.min.x,_ab.max.x,_b.min.x,_b.max.x) && eng(_ab.min.z,_ab.max.z,_b.min.z,_b.max.z))
        top=Math.max(top,_b.max.y); }
    const d=top-_ab.min.y;
    if(lift || d<0) mesh.position.y+=d;
  }
  function relaxAll(){ if(active) settle(active,true);
    shapes.slice().sort((a,b)=>a.position.y-b.position.y).forEach(m=>{ if(m!==active) settle(m,false); }); }
  function hl(mesh,on){ if(mesh&&mesh.userData.edge){ mesh.userData.edge.material.color.setHex(on?0xbfe6ff:0x5fa0e0); mesh.userData.edge.material.opacity=on?1:0.6; } }
  function select(mesh){ if(active&&active!==mesh) hl(active,false); active=mesh; hl(mesh,true); buildTools(mesh.userData.type); }
  function conjure(type){
    const m=ghostMesh(type); const n=shapes.length;
    m.position.set(((n%5)-2)*2.8, 0, 3 + Math.floor(n/5)*2.8);
    const L=LAST[type]; if(L){ m.userData.target.copy(L.target); m.rotation.copy(L.rot); }   // reuse last-used size/rotation
    scene.add(m); shapes.push(m); select(m);
  }
  function del(){ if(!active)return; scene.remove(active); const i=shapes.indexOf(active); if(i>=0)shapes.splice(i,1); active=null; document.getElementById('tools').style.display='none'; }

  // ---------- arrange UI ----------
  const SHAPES=['box','wall','plane','cylinder','cone','pyramid','sphere'];
  const pal=document.getElementById('palette');
  SHAPES.forEach(s=>{ const d=document.createElement('div'); d.className='p'; d.textContent=s; d.onclick=()=>conjure(s); pal.appendChild(d); });
  function btn(txt,fn,cls){ const b=document.createElement('div'); b.className='b'+(cls?' '+cls:''); b.textContent=txt; b.onclick=fn; return b; }
  function buildTools(type){
    const t=document.getElementById('tools'); t.innerHTML=''; t.style.display='flex';
    if(active && active.userData.painted){                   // committed — the transformation cannot be undone
      const lbl=document.createElement('div'); lbl.className='row';
      lbl.innerHTML='<span style="width:auto;color:#8fe0b0;letter-spacing:.04em">🔒 committed</span>';
      t.appendChild(lbl);
      const prow=document.createElement('div'); prow.className='row';
      prow.appendChild(btn('🎨',enterPaint,'paint')); prow.appendChild(btn('✕',del,'del'));
      t.appendChild(prow); return;
    }
    if((AXES[type]||[]).length>1){ const urow=document.createElement('div'); urow.className='row';   // overall uniform scale (keeps proportions)
      urow.appendChild(btn('⊖',()=>scaleAll(1/1.12)));
      const us=document.createElement('span'); us.textContent='size'; us.style.width='auto'; urow.appendChild(us);
      urow.appendChild(btn('⊕',()=>scaleAll(1.12))); t.appendChild(urow); }
    (AXES[type]||[]).forEach(([label,axis])=>{ const row=document.createElement('div'); row.className='row';
      row.appendChild(btn('−',()=>resizeAxis(axis,1/1.12)));
      const s=document.createElement('span'); s.textContent=label; row.appendChild(s);
      row.appendChild(btn('+',()=>resizeAxis(axis,1.12))); t.appendChild(row); });
    const rotrow=document.createElement('div'); rotrow.className='row';    // spin (yaw) + lean (tilt)
    rotrow.appendChild(btn('↺',()=>rotY(-Math.PI/12))); rotrow.appendChild(btn('↻',()=>rotY(Math.PI/12)));
    rotrow.appendChild(btn('◣',()=>lean(Math.PI/12)));  rotrow.appendChild(btn('◢',()=>lean(-Math.PI/12)));
    t.appendChild(rotrow);
    const yrow=document.createElement('div'); yrow.className='row';    // raise/sink (embed) + tumble (random rock)
    yrow.appendChild(btn('▼',()=>nudgeY(-0.22)));
    const ys=document.createElement('span'); ys.textContent='↕'; yrow.appendChild(ys);
    yrow.appendChild(btn('▲',()=>nudgeY(0.22))); yrow.appendChild(btn('🎲',tumble));
    t.appendChild(yrow);
    const prow=document.createElement('div'); prow.className='row';
    prow.appendChild(btn('🎨',enterPaint,'paint')); prow.appendChild(btn('⧉',duplicate)); prow.appendChild(btn('⎌',resetShape)); prow.appendChild(btn('✕',del,'del'));
    t.appendChild(prow);
  }
  function resizeAxis(axis,f){ if(!active||active.userData.painted)return; const s=active.userData.target;   // no resize once painted
    if(axis.indexOf('x')>=0) s.x=Math.max(0.25,Math.min(6,s.x*f));
    if(axis.indexOf('y')>=0) s.y=Math.max(0.25,Math.min(6,s.y*f));
    if(axis.indexOf('z')>=0) s.z=Math.max(0.25,Math.min(6,s.z*f));
    if(active.userData.grow>=1){ active.scale.copy(s); relaxAll(); }
    remember();
  }
  function scaleAll(f){ if(!active||active.userData.painted)return; const s=active.userData.target;   // overall uniform scale — keeps proportions
    const mx=Math.max(s.x,s.y,s.z), mn=Math.min(s.x,s.y,s.z);
    if(f>1) f=Math.min(f,6/mx); else f=Math.max(f,0.25/mn);       // clamp the whole so no axis leaves range
    s.multiplyScalar(f);
    if(active.userData.grow>=1){ active.scale.copy(s); relaxAll(); }
    remember();
  }
  function nudgeY(dy){ if(!active||active.userData.painted)return;                 // raise/sink freely — embed a ghost INTO a solid (landscapes, trees, buildings)
    active.userData.freeY=true; active.position.y=Math.max(-5,Math.min(20,active.position.y+dy)); }
  function tumble(){ if(!active||active.userData.painted)return;                   // random orientation → natural rocks; then it rests on its lowest point
    active.userData.freeY=false; active.rotation.set(Math.random()*6.283,Math.random()*6.283,Math.random()*6.283); relaxAll(); remember(); }
  function rotY(d){ if(!active||active.userData.painted)return; active.rotation.y+=d; relaxAll(); remember(); }   // spin (yaw)
  function lean(d){ if(!active||active.userData.painted)return; active.rotation.x+=d; relaxAll(); remember(); }   // lean (tilt)
  function remember(){ if(active&&!active.userData.painted) LAST[active.userData.type]={target:active.userData.target.clone(), rot:active.rotation.clone()}; }
  function resetShape(){ if(!active||active.userData.painted)return;                // back to default size, no rotation, on the ground
    active.userData.target.set(1,1,1); active.rotation.set(0,0,0); active.userData.freeY=false; relaxAll(); }

  // ---------- copy / paste ----------
  let clip=null;
  function makeFrom(type,tgt,near){
    const m=ghostMesh(type); m.userData.target.copy(tgt);
    const nx=near?near.x:((shapes.length%5)-2)*2.8, nz=near?near.z:3+Math.floor(shapes.length/5)*2.8;
    m.position.set(Math.max(-LIM,Math.min(LIM,nx+1.6)), 0, nz);
    scene.add(m); shapes.push(m); select(m); relaxAll();
  }
  function duplicate(){ if(active) makeFrom(active.userData.type, active.userData.target, active.position); }
  function copyShape(){ if(active) clip={type:active.userData.type, target:active.userData.target.clone()}; }
  function pasteShape(){ if(clip) makeFrom(clip.type, clip.target, active?active.position:null); }

  // ---------- paint UI ----------
  const swWrap=document.getElementById('swatches'), nozWrap=document.getElementById('nozzles');
  function buildSwatches(){ swWrap.innerHTML=''; COLORS.forEach((c,i)=>{ const d=document.createElement('div');
    d.className='c'+(i===colorIdx?' on':''); d.style.background='#'+c.toString(16).padStart(6,'0');
    d.onclick=()=>{ colorIdx=i; buildSwatches(); }; swWrap.appendChild(d); }); }
  function buildNozzles(){ nozWrap.innerHTML=''; NOZZLES.forEach((nz,i)=>{ const d=document.createElement('div');
    d.className='n'+(i===nozIdx?' on':''); d.textContent=nz.name;
    d.onclick=()=>{ nozIdx=i; buildNozzles(); }; nozWrap.appendChild(d); }); }
  const _savedTarget=new THREE.Vector3(); let _savedRadius=12;
  function enterPaint(){ if(!active) return; paintMode=true;                  // shape solidifies on first SPRAY, not on entry
    document.body.classList.add('painting'); buildSwatches(); buildNozzles();
    _savedTarget.copy(target); _savedRadius=radius;                          // frame the shape so every face is easy to aim at
    boundsOf(active,_ab);
    target.set((_ab.min.x+_ab.max.x)/2,(_ab.min.y+_ab.max.y)/2,(_ab.min.z+_ab.max.z)/2);
    const sz=Math.max(_ab.max.x-_ab.min.x,_ab.max.y-_ab.min.y,_ab.max.z-_ab.min.z);
    radius=Math.max(3.2, sz*2.6+2.2); updateCam(); camera.updateMatrixWorld(true);
    document.getElementById('hudtip').innerHTML='drag on the shape to <b>spray</b> · close = tight, far = splatter · right-drag orbit · scroll zoom';
    setStatus('painting — drag to spray'); }
  function exitPaint(){ if(cur) endStroke(); paintMode=false; document.body.classList.remove('painting');
    target.copy(_savedTarget); radius=_savedRadius; updateCam();                // restore the overview for arranging
    document.getElementById('hudtip').innerHTML='tap a shape to conjure · tap any shape to select · drag to move · <b>🎨</b> paint the selected shape';
    setStatus(''); }
  document.getElementById('done').onclick=exitPaint;
  function setStatus(t){ document.getElementById('status').textContent=t; }

  // ---------- input ----------
  const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), dragOff=new THREE.Vector3();
  const _up=new THREE.Vector3(0,1,0), dragPlane=new THREE.Plane(), _pp=new THREE.Vector3();
  const LIM=19;
  let mode=null, lx=0, ly=0;
  function pick(cx,cy){ ndc.set((cx/innerWidth)*2-1,-(cy/innerHeight)*2+1); ray.setFromCamera(ndc,camera); return ray.intersectObjects(shapes,false)[0]||null; }
  function pickPaint(cx,cy){ if(!active)return null; ndc.set((cx/innerWidth)*2-1,-(cy/innerHeight)*2+1); ray.setFromCamera(ndc,camera); return ray.intersectObject(active,false)[0]||null; }
  function planeHit(cx,cy){ ndc.set((cx/innerWidth)*2-1,-(cy/innerHeight)*2+1); ray.setFromCamera(ndc,camera); return ray.ray.intersectPlane(dragPlane,_pp)?_pp:null; }
  function down(cx,cy,right){
    if(right){ mode='orbit'; lx=cx; ly=cy; return; }
    if(paintMode){
      const h=pickPaint(cx,cy);
      if(h){ mode='paint'; startStroke(h); } else mode='orbit';
    } else {
      const h=pick(cx,cy);
      if(h){ select(h.object);
        if(h.object.userData.painted){ mode='orbit'; }         // painted = locked in place (select-only)
        else { mode='move'; dragPlane.setFromNormalAndCoplanarPoint(_up,h.point);
          const g=planeHit(cx,cy); if(g) dragOff.set(h.object.position.x-g.x,0,h.object.position.z-g.z); else dragOff.set(0,0,0); } }
      else mode='orbit';
    }
    lx=cx; ly=cy;
  }
  function move(cx,cy){
    if(mode==='orbit'){ theta-=(cx-lx)*0.006; phi-=(cy-ly)*0.006; phi=Math.max(0.12,Math.min(Math.PI/2-0.02,phi)); updateCam(); }
    else if(mode==='paint'&&cur){ const h=pickPaint(cx,cy); if(h&&h.object===cur.atom&&(h.face.materialIndex||0)===cur.si) addPoint(h); }
    else if(mode==='move' && active){ const p=planeHit(cx,cy); if(p){
        active.position.x=Math.max(-LIM,Math.min(LIM,p.x+dragOff.x));
        active.position.z=Math.max(-LIM,Math.min(LIM,p.z+dragOff.z)); relaxAll(); } }
    lx=cx; ly=cy;
  }
  function up(){ if(mode==='paint') endStroke(); mode=null; }
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('mousedown',e=>down(e.clientX,e.clientY,e.button===2));
  addEventListener('mousemove',e=>{ if(mode) move(e.clientX,e.clientY); });
  addEventListener('mouseup',up);
  el.addEventListener('wheel',e=>{ e.preventDefault(); radius=Math.max(4,Math.min(40,radius+e.deltaY*0.01)); updateCam(); },{passive:false});
  el.addEventListener('touchstart',e=>{ const t=e.touches[0]; down(t.clientX,t.clientY,e.touches.length>1); e.preventDefault(); },{passive:false});
  el.addEventListener('touchmove',e=>{ const t=e.touches[0]; if(mode) move(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
  el.addEventListener('touchend',up);
  addEventListener('keydown',e=>{ if(!(e.ctrlKey||e.metaKey)||paintMode)return; const k=e.key.toLowerCase();
    if(k==='c'){ copyShape(); e.preventDefault(); } else if(k==='v'){ pasteShape(); e.preventDefault(); }
    else if(k==='d'){ duplicate(); e.preventDefault(); } });

  // ---------- save (bake to BMF atoms + BMC scene; mint stubbed) ----------
  function bakeParams(type,s){ const b=BASE[type];
    switch(type){
      case 'plane':    return {w:+(b.w*s.x).toFixed(3), d:+(b.d*s.z).toFixed(3)};
      case 'wall':     return {w:+(b.w*s.x).toFixed(3), h:+(b.h*s.y).toFixed(3), t:+(b.t*s.z).toFixed(3)};
      case 'box':      return {w:+(b.w*s.x).toFixed(3), h:+(b.h*s.y).toFixed(3), d:+(b.d*s.z).toFixed(3)};
      case 'cylinder': return {r:+(b.r*s.x).toFixed(3), h:+(b.h*s.y).toFixed(3)};
      case 'sphere':   return {r:+(b.r*s.x).toFixed(3)};
      case 'cone':     return {r:+(b.r*s.x).toFixed(3), h:+(b.h*s.y).toFixed(3)};
      case 'pyramid':  return {r:+(b.r*s.x).toFixed(3), h:+(b.h*s.y).toFixed(3)};
    } return {};
  }
  async function gzipSize(str){ if(!self.CompressionStream) return null;
    const cs=new CompressionStream('gzip'), w=cs.writable.getWriter(); w.write(new TextEncoder().encode(str)); w.close();
    return (await new Response(cs.readable).arrayBuffer()).byteLength; }
  async function exportScene(){
    if(!shapes.length){ setStatus('nothing to save yet — conjure something'); return; }
    const parts=[]; let painted=0, sc=0, pc=0;
    for(const m of shapes){ const u=m.userData, type=u.type;
      const part={ bmf:'shape', v:1, type, params:bakeParams(type,u.target),
        pos:[+m.position.x.toFixed(3),+m.position.y.toFixed(3),+m.position.z.toFixed(3)],
        rot:[+m.rotation.x.toFixed(3),+m.rotation.y.toFixed(3),+m.rotation.z.toFixed(3)] };
      if(u.surfaces){ const paint=[]; u.surfaces.forEach((s,i)=>{ if(s&&s.strokes.length){ paint.push({surf:i,strokes:s.strokes}); sc+=s.strokes.length; s.strokes.forEach(st=>pc+=st.pts.length); } });
        if(paint.length){ part.paint=paint; painted++; } }
      parts.push(part);
    }
    const out={ bmf:'bmc', v:1, parts };
    const json=JSON.stringify(out), bytes=new TextEncoder().encode(json).length, gz=await gzipSize(json);
    setStatus(`${parts.length} atom(s) · ${painted} painted · ${sc} strokes · ${pc} pts → ${bytes} B`+(gz!=null?` · ${gz} B gzip`:'')+"  —  it's yours ✓ (mint next)");
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download='grafverse-scene.bmc.json'; a.click(); URL.revokeObjectURL(a.href);
    console.log(out);
  }
  document.getElementById('save').onclick=exportScene;

  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  (function loop(){
    for(const m of shapes){ const u=m.userData;
      if(u.grow<1){ u.grow=Math.min(1,u.grow+0.09); const e=1-Math.pow(1-u.grow,3); m.scale.copy(u.target).multiplyScalar(0.15+0.85*e); }
      else m.scale.copy(u.target);
    }
    stepDrips();
    renderer.render(scene,camera); requestAnimationFrame(loop);
  })();
})();
</script>
