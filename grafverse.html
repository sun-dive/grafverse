<style>
  :root{ --fg:#eaf2ff; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#000;font-family:-apple-system,Segoe UI,Roboto,system-ui,sans-serif;color:var(--fg);}
  #app{position:fixed;inset:0;}
  canvas{display:block;}

  /* --- HUD overlays --- */
  #reticle{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
           border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 6px #fff;
           pointer-events:none;opacity:0;transition:opacity .3s;}
  #hint{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);
        font-size:15px;letter-spacing:.02em;color:#cfe0ff;text-shadow:0 1px 6px #000;
        padding:6px 14px;background:rgba(10,16,30,.35);border-radius:20px;
        backdrop-filter:blur(4px);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .4s;}

  #meterWrap{position:fixed;left:24px;bottom:24px;width:190px;opacity:0;transition:opacity .4s;pointer-events:none;}
  #meterLbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9fb4d8;margin-bottom:6px;}
  #meterBar{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;}
  #meterFill{height:100%;width:100%;border-radius:6px;background:#38e1ff;transition:width .08s linear, background .2s;}

  #swatches{position:fixed;left:24px;bottom:70px;display:flex;gap:8px;opacity:0;transition:opacity .4s;pointer-events:none;}
  .sw{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.25);transition:transform .12s, border-color .12s;}
  .sw.on{border-color:#fff;transform:scale(1.25);}

  /* --- wallets (custodial vs black-market) --- */
  #wallet{position:fixed;right:20px;top:18px;min-width:214px;opacity:0;transition:opacity .5s;pointer-events:none;
    font:12px/1.4 system-ui;color:#cfe0ff;text-align:right;text-shadow:0 1px 4px #000;}
  #wallet .wrow{display:flex;justify-content:space-between;gap:14px;align-items:baseline;}
  #wallet .wname{letter-spacing:.05em;color:#9fb4d8;}
  #wallet .wval{font-weight:700;}
  #wallet .wval b{font-size:16px;color:#f7c65a;font-variant-numeric:tabular-nums;}
  #wallet .wmeta{font-size:10px;color:#6f86ad;margin:1px 0 9px;letter-spacing:.03em;}
  #wallet .wrow.blk .wname{color:#c98bd0;}
  #wallet .wrow.blk .wval{color:#c98bd0;font-weight:600;font-size:11px;}
  #wallet .wmeta.blk{color:#7a5a86;}
  /* --- shape "make" buttons (live inside the right-edge Manifest HUD) --- */
  .pbtn{padding:7px 10px;border-radius:10px;background:rgba(16,30,58,.9);border:1px solid rgba(120,170,255,.35);color:#cfe0ff;font:600 12px system-ui;pointer-events:auto;cursor:pointer;white-space:nowrap;}
  .pbtn b{color:#6fd3ff;margin-right:4px;}
  .pbtn:active,.pbtn.on{background:rgba(56,120,210,.95);border-color:#8fd0ff;}
  /* --- two-colour paint inventory (leftover can + full can) --- */
  #inv{position:fixed;left:24px;bottom:24px;display:none;flex-direction:column;gap:8px;opacity:0;transition:opacity .4s;z-index:6;}
  .islot{display:flex;align-items:center;gap:8px;pointer-events:auto;cursor:pointer;opacity:.5;transition:opacity .15s;}
  .islot.on{opacity:1;}
  .idot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.3);flex:none;}
  .islot.on .idot{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.5);}
  .ibar{width:120px;height:10px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;}
  .ifill{height:100%;border-radius:6px;transition:width .08s linear;}
  .iamt{font:600 11px system-ui;color:#cfe0ff;width:36px;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000;}
  /* --- shape panel (pop-in side HUD) --- */
  #shapeTab{position:fixed;right:0;top:50%;transform:translateY(-50%);display:none;z-index:8;
    padding:14px 9px;border-radius:12px 0 0 12px;background:rgba(20,40,74,.92);border:1px solid rgba(120,170,255,.4);border-right:none;
    color:#cfe0ff;font:600 12px system-ui;writing-mode:vertical-rl;letter-spacing:.14em;cursor:pointer;pointer-events:auto;}
  body.building #shapeTab{display:block;}
  body.shaping #shapeTab, body.keep #shapeTab{display:none;}
  #shapePanel{position:fixed;right:-260px;top:50%;transform:translateY(-50%);width:206px;z-index:9;
    background:rgba(8,14,26,.94);border:1px solid rgba(120,170,255,.35);border-radius:14px 0 0 14px;border-right:none;
    padding:14px 12px;transition:right .22s ease;pointer-events:none;}
  body.shaping #shapePanel{right:0;pointer-events:auto;}
  #shapeTools{display:flex;flex-direction:column;gap:7px;}
  .mkhdr{font:700 10px system-ui;letter-spacing:.2em;text-transform:uppercase;color:#7f95bb;text-align:center;margin:2px 0 -1px;}
  .mkgrid{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;}
  .srow{display:flex;gap:6px;align-items:center;justify-content:center;}
  .srow span{font:700 12px system-ui;color:#bcd0f0;width:30px;text-align:center;}
  .sb{min-width:40px;height:38px;padding:0 8px;border-radius:10px;background:rgba(24,46,82,.95);border:1px solid rgba(120,170,255,.45);
    color:#eaf6ff;font:700 18px system-ui;cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:auto;}
  .sb.wide{flex:1;font-size:13px;letter-spacing:.05em;}
  .sb.done{flex:1;font-size:14px;background:rgba(30,90,70,.95);border-color:rgba(120,255,190,.5);}
  .sb:active{background:rgba(56,120,210,.95);}
  body.mtalk #shapeTab, body.mtalk #shapePanel{display:none!important;}

  /* --- top "Keep / Immortalize" HUD --- */
  #keepTab{position:fixed;top:0;left:50%;transform:translateX(-50%);display:none;z-index:8;
    padding:7px 20px;border-radius:0 0 12px 12px;background:rgba(20,40,74,.92);border:1px solid rgba(120,170,255,.4);border-top:none;
    color:#cfe0ff;font:600 11px system-ui;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;pointer-events:auto;}
  body.building #keepTab{display:block;}
  body.mtalk #keepTab, body.shaping #keepTab, body.keep #keepTab{display:none;}
  #keepPanel{position:fixed;top:-360px;left:50%;transform:translateX(-50%);width:min(300px,92vw);z-index:9;
    background:rgba(8,14,26,.95);border:1px solid rgba(120,170,255,.35);border-radius:0 0 16px 16px;border-top:none;
    padding:15px 15px 17px;transition:top .22s ease;pointer-events:none;display:flex;flex-direction:column;gap:8px;}
  body.keep #keepPanel{top:0;pointer-events:auto;}
  .kh{text-align:center;font:700 11px system-ui;letter-spacing:.2em;text-transform:uppercase;color:#9fb4d8;margin-bottom:2px;}
  .kbtn{padding:12px 14px;border-radius:12px;background:rgba(24,46,82,.95);border:1px solid rgba(120,170,255,.45);
    color:#eaf6ff;font:600 14px system-ui;text-align:center;cursor:pointer;pointer-events:auto;}
  .kbtn:active{background:rgba(56,120,210,.95);}
  .kbtn.immortal{background:rgba(58,42,88,.95);border-color:rgba(200,160,255,.5);color:#e8d8ff;}
  .kbtn.done{background:rgba(30,90,70,.9);border-color:rgba(120,255,190,.5);}
  .kfoot{font:12px/1.45 system-ui;color:#8fa6cc;text-align:center;min-height:1em;padding:2px 4px 0;}

  /* --- dialogue --- */
  #dialogue{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);max-width:min(680px,92vw);
            padding:18px 22px;background:rgba(8,14,26,.82);border:1px solid rgba(120,170,255,.28);
            border-radius:14px;backdrop-filter:blur(6px);box-shadow:0 10px 40px rgba(0,0,0,.5);
            opacity:0;transition:opacity .5s;pointer-events:none;}
  #dspeaker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#6fd3ff;margin-bottom:8px;}
  #dtext{font-size:17px;line-height:1.45;color:#f3f7ff;min-height:1.4em;}
  #dsub{margin-top:10px;font-size:13px;color:#8fa6cc;font-style:italic;}
  #chatInput{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);width:min(560px,84vw);
    display:none;padding:12px 18px;font-size:16px;color:#eaf6ff;background:rgba(8,16,30,.92);
    border:1px solid rgba(120,170,255,.5);border-radius:24px;outline:none;font-family:inherit;
    box-shadow:0 8px 30px rgba(0,0,0,.55);}
  #chatInput::placeholder{color:#5f7bab;}
  html,body{overscroll-behavior:none;}
  canvas{touch-action:none;}
  #mobileUI{position:fixed;inset:0;display:none;pointer-events:none;z-index:6;}
  #joyBase{position:fixed;left:26px;bottom:26px;width:130px;height:130px;border-radius:50%;
    background:rgba(120,160,220,.10);border:1px solid rgba(150,190,255,.35);pointer-events:auto;touch-action:none;}
  #joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;
    background:rgba(180,210,255,.45);border:1px solid rgba(220,235,255,.6);transform:translate(-50%,-50%);}
  #sprayBtn{position:fixed;right:28px;bottom:36px;width:104px;height:104px;border-radius:50%;
    background:rgba(56,225,255,.16);border:2px solid rgba(120,230,255,.6);color:#dffaff;
    font:600 15px/104px system-ui;text-align:center;letter-spacing:.12em;pointer-events:auto;touch-action:none;
    text-transform:uppercase;user-select:none;-webkit-user-select:none;}
  #sprayBtn.down{background:rgba(56,225,255,.4);}
  #backBtn{position:fixed;left:28px;bottom:36px;width:90px;height:90px;border-radius:50%;
    background:rgba(120,150,220,.14);border:2px solid rgba(150,180,255,.55);color:#dfe8ff;
    font:600 14px/90px system-ui;text-align:center;letter-spacing:.1em;pointer-events:auto;touch-action:none;
    text-transform:uppercase;user-select:none;-webkit-user-select:none;}
  #backBtn.down{background:rgba(120,150,220,.4);}
  #grabBtn{position:fixed;left:28px;bottom:140px;display:none;padding:12px 18px;border-radius:22px;
    background:rgba(20,40,74,.9);border:1px solid rgba(120,170,255,.5);color:#dfe8ff;font:600 13px system-ui;
    letter-spacing:.1em;text-transform:uppercase;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;}
  body.building #grabBtn{display:block;}
  body.mtalk #grabBtn, body.shaping #grabBtn, body.keep #grabBtn{display:none!important;}
  body.shaping #sprayBtn, body.shaping #backBtn,
  body.keep #sprayBtn, body.keep #backBtn{display:none!important;}   /* no firing / walking while shaping or keeping */
  #talkBtn{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);display:none;
    padding:12px 26px;border-radius:24px;background:rgba(8,16,30,.85);border:1px solid rgba(120,170,255,.55);
    color:#eaf6ff;font:600 14px system-ui;letter-spacing:.14em;text-transform:uppercase;pointer-events:auto;
    user-select:none;-webkit-user-select:none;}
  #chips{position:fixed;left:0;right:0;bottom:0;display:none;flex-direction:column;gap:8px;
    align-items:center;max-height:34vh;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;z-index:7;pointer-events:auto;padding:12px 14px 18px;
    background:linear-gradient(to top,rgba(4,6,12,.82),rgba(4,6,12,0));}
  .chip{width:min(420px,88%);text-align:center;padding:12px 16px;border-radius:14px;
    background:rgba(18,36,68,.95);border:1px solid rgba(120,170,255,.5);color:#eaf6ff;
    font:600 15px system-ui;white-space:normal;user-select:none;-webkit-user-select:none;}
  .chip:active{background:rgba(56,120,210,.95);}
  body.mtalk #chips{display:flex;}
  body.mtalk #dialogue{top:54px;bottom:auto;max-height:44vh;overflow-y:auto;touch-action:pan-y;pointer-events:auto;}
  body.mtalk #joyBase, body.mtalk #sprayBtn, body.mtalk #backBtn{display:none!important;}
  body.mtalk #talkBtn{top:14px;bottom:auto;left:auto;right:14px;transform:none;}

  /* --- splash --- */
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:18px;background:radial-gradient(ellipse at center,#0a1226 0%,#000 70%);z-index:10;cursor:pointer;
          transition:opacity .6s;}
  #splash h1{font-size:clamp(42px,9vw,96px);font-weight:800;letter-spacing:-.02em;
             background:linear-gradient(180deg,#eaf2ff,#6fb6ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #splash .tag{font-size:15px;color:#7fa6df;letter-spacing:.04em;}
  #splash .go{margin-top:22px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#cfe0ff;
              padding:12px 26px;border:1px solid rgba(140,180,255,.4);border-radius:30px;}
  #splash .creed{position:absolute;bottom:26px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#3f5a86;}
  .hidden{opacity:0!important;pointer-events:none!important;}
  #tag2{font-size:13px;color:#5f7bab;font-style:italic;}
</style>

<script>
(function(){
  "use strict";
  if(!window.THREE){ document.getElementById('tag2').textContent = "⚠ vendor/three.min.js not found next to this file."; return; }

  // ---------- config ----------
  const COLORS = [0x38e1ff, 0xff3ea5, 0x7CFC00, 0xffe94d, 0xff7a00];
  const EYE = 1.7, SPEED = 2.1, SENS = 0.0022, PITCH_MAX = 1.45;
  const GROUND = 500;          // ground plane size (units)
  const TEX = 2048;            // paint canvas resolution
  const PAINT_DRAIN = 0.22;    // per frame while spraying
  const CAN_POS = new THREE.Vector3(0, 0.35, -9);      // first can, a few steps ahead
  const MACHINE_POS = new THREE.Vector3(3, 0, -26);    // the glowing box in the (nearer) distance
  const MACHINE_STOCK = 6;                             // cans behind the glass (set 0 for an empty machine)
  const MOBILE = window.matchMedia('(pointer: coarse)').matches;  // touch-primary device
  let mWalk = false;                                   // mobile: touch-and-hold = walk forward
  let mBack = false;                                   // mobile: hold the Back button = walk backward
  if(MOBILE){ const _go=document.querySelector('#splash .go'); if(_go) _go.textContent='Tap to begin'; }

  // ---------- renderer / scene / camera ----------
  const app = document.getElementById('app');
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  app.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000006);
  scene.fog = new THREE.FogExp2(0x000006, 0.0016);

  const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 5000);
  camera.rotation.order = 'YXZ';
  camera.position.set(0, EYE, 0);
  scene.add(camera);

  scene.add(new THREE.AmbientLight(0x2a3350, 0.6));
  const key = new THREE.DirectionalLight(0x8899cc, 0.5); key.position.set(3,10,2); scene.add(key);

  // ---------- starfield (you are floating in space) ----------
  (function stars(){
    const N = 3500, pos = new Float32Array(N*3);
    for(let i=0;i<N;i++){
      // random point on a shell
      const r = 700 + Math.random()*1600;
      const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
      pos[i*3]   = r*Math.sin(p)*Math.cos(t);
      pos[i*3+1] = r*Math.cos(p);
      pos[i*3+2] = r*Math.sin(p)*Math.sin(t);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    const m = new THREE.PointsMaterial({ color:0xffffff, size:2.2, sizeAttenuation:true, transparent:true, opacity:.9, depthWrite:false, fog:false });
    scene.add(new THREE.Points(g,m));
  })();

  // ---------- the paintable ground (invisible until painted) ----------
  const pc = document.createElement('canvas'); pc.width = pc.height = TEX;
  const pctx = pc.getContext('2d');
  pctx.clearRect(0,0,TEX,TEX);                 // fully transparent => void
  const paintTex = new THREE.CanvasTexture(pc);
  paintTex.anisotropy = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(GROUND, GROUND),
    new THREE.MeshBasicMaterial({ map:paintTex, transparent:true, depthWrite:false })
  );
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  // helper: uv -> canvas px
  function toPx(uv){ return { x: uv.x*TEX, y:(1-uv.y)*TEX }; }

  // spray a glowing splat (additive within the canvas so overlaps go white-hot).
  // dwell = how long you've lingered on one spot → paint pools & spatters (rewards a confident stroke).
  let lastPx=null, dwell=0;
  function spray(uv){
    const {x,y} = toPx(uv);
    if(lastPx){ const dd=Math.hypot(x-lastPx.x, y-lastPx.y);
      dwell = dd<18 ? Math.min(1, dwell+0.06) : Math.max(0, dwell-0.14); }
    lastPx={x,y};
    const col = new THREE.Color(COLORS[colorIdx]);
    const cr = (col.r*255)|0, cg=(col.g*255)|0, cb=(col.b*255)|0;
    pctx.globalCompositeOperation = 'lighter';
    const main = (32 + rnd()*8) * (1 + dwell*0.9);   // pools outward when you linger
    const core = 0.55 + dwell*0.35;                          // brighter, wetter core on dwell
    const g = pctx.createRadialGradient(x,y,0, x,y,main);
    g.addColorStop(0,   `rgba(${cr},${cg},${cb},${core})`);
    g.addColorStop(0.5, `rgba(${cr},${cg},${cb},0.22)`);
    g.addColorStop(1,   `rgba(${cr},${cg},${cb},0)`);
    pctx.fillStyle = g;
    pctx.beginPath(); pctx.arc(x,y,main,0,7); pctx.fill();
    // scattered droplets => spray-can texture; more + further as it starts to run
    const drops = 6 + (dwell*12|0);
    for(let i=0;i<drops;i++){
      const a=rnd()*7, d=rnd()*main*(1.4+dwell*1.2), rr=1+rnd()*(3+dwell*3);
      const dx=x+Math.cos(a)*d, dy=y+Math.sin(a)*d;
      pctx.fillStyle = `rgba(${cr},${cg},${cb},${0.14+rnd()*0.28})`;
      pctx.beginPath(); pctx.arc(dx,dy,rr,0,7); pctx.fill();
    }
    pctx.globalCompositeOperation = 'source-over';
    paintTex.needsUpdate = true;
  }

  // ---------- a spray can (pickup + viewmodel) ----------
  let _canTex=null;
  function canLabelTex(){
    if(_canTex) return _canTex;
    const c=document.createElement('canvas'); c.width=1024; c.height=512; const g=c.getContext('2d');
    g.fillStyle='#14264a'; g.fillRect(0,0,1024,512);
    g.textAlign='center'; g.textBaseline='middle';
    // two interlocked rings — the covenant
    g.strokeStyle='#eaf2ff'; g.lineWidth=11;
    g.beginPath(); g.arc(486,80,32,0,7); g.stroke();
    g.beginPath(); g.arc(538,80,32,0,7); g.stroke();
    // creed
    g.fillStyle='#eaf2ff'; g.font='bold 52px sans-serif';
    g.fillText('IN THE COVENANT', 512, 176);
    g.fillText('WE TRUST', 512, 230);

  // ---------- audio (synthesised, fully offline — no files) ----------
  let actx=null, hissGain=null;
  function initAudio(){
    if(actx) return;
    try{
      const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
      actx = new AC();
      const buf = actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
      const d = buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      const src = actx.createBufferSource(); src.buffer=buf; src.loop=true;
      const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1900;
      const bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=5400; bp.Q.value=0.6;
      hissGain = actx.createGain(); hissGain.gain.value=0;
      src.connect(hp); hp.connect(bp); bp.connect(hissGain); hissGain.connect(actx.destination);
      src.start();
    }catch(e){ actx=null; hissGain=null; }
  }
  function sputter(){
    if(!actx||!hissGain) return;
    const t=actx.currentTime;
    for(let i=0;i<4;i++){ hissGain.gain.setValueAtTime(0.11, t+i*0.06); hissGain.gain.setValueAtTime(0.0, t+i*0.06+0.03); }
  }
  // chirpy "speech" blip — one per spoken character, so it sounds like the machine is talking (text = translation)
  function blip(base){
    if(!actx) return;
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.type='square'; o.frequency.value=(base||440)+Math.random()*380;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.04, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.05);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.06);
  }

      scavCan.rotation.y += dt*1.4;
      scavCan.position.y = 0.35 + Math.sin(performance.now()*0.0031)*0.08;
      scavRing.material.opacity = 0.25 + Math.sin(performance.now()*0.004)*0.12;
      if(planarDist(scavCan.position) < 3.4){
        emptyAnnounced=false; addCan(scavColor, 100);               // full can → its (random) colour, added to your inventory
        if(!hasCan){ hasCan=true; viewCan=makeCan(0.5, COLORS[scavColor]); viewCan.position.set(0.42,-0.34,-0.9); viewCan.rotation.z=-0.15; camera.add(viewCan); }
        unlockBuild();
        showHint('A stashed can — '+COLNAMES[scavColor]+' paint, free. Someone always leaves one back here.');
        scene.remove(scavCan); scene.remove(scavRing); scavCan=null;
        scavRespawn = performance.now() + 5000;                     // another appears shortly — there's always one
      }
    } else if(scavRespawn && performance.now()>scavRespawn){ scavRespawn=0; spawnScav(); }

    // spraying
    if(hasCan && spraying && paint>0){
      if(heldGhost){ heldGhost=null; document.body.classList.remove('holding'); }   // first spray locks the held ghost in place, then paints it
      ray.setFromCamera(CENTER, camera);
      const shot = bShapes.length ? ray.intersectObjects(bShapes,false)[0] : null;
      if(shot && shot.uv){                                 // crosshair on a manifested shape → paint & solidify it
        const o=shot.object; solidify(o);
        const si=(shot.face && shot.face.materialIndex)||0, surf=o.userData.surfaces[si];
        if(surf){
          const dist=camera.position.distanceTo(shot.point), dn=Math.max(0,Math.min(1,(dist-2.2)/(9-2.2)));
          const key=targetKey(o,si);
          if(curKey!==key){ endStroke(); beginStroke(o,si); }
          if(addDab(shot.uv.x, shot.uv.y, dn)) sprayShapeAt(surf, shot.uv.x, shot.uv.y, dn);   // record + spray on each dab
          materializeShape(o); hasPainted=true;
          o.userData.paintAmt=(o.userData.paintAmt||0)+PAINT_DRAIN;                 // paint-to-earn: ~half-cover a solid shape → a can's pay
          if(!o.userData.paid && o.userData.paintAmt>=(o.userData.earnAt||45)){
            o.userData.paid=true; custodial+=EARN_PAY; renderWallet();
            showHint('+'+EARN_PAY+' sats — enough for another can. Paint to earn.'); blip(700);
          }
        }
      } else {
        const hit = ray.intersectObject(ground)[0];        // otherwise → paint the ground
        if(hit && hit.uv){
          if(curKey!=='g'){ endStroke(); beginStroke('ground',0); }
          if(addDab(hit.uv.x, hit.uv.y, 0)) spray(hit.uv);
          hasPainted=true;
        }
      }
      paint = Math.max(0, paint - PAINT_DRAIN);
      if(inv[activeSlot]){ inv[activeSlot].amt=paint; updateInvActive(); }
      if(viewCan) viewCan.position.y = -0.34 + Math.sin(performance.now()*0.05)*0.01; // tiny shake
      if(paint===0){
        const other=(activeSlot+1)%2;
        if(inv[other] && inv[other].amt>0){ activeSlot=other; syncActive(); renderInv(); }   // auto-switch to your other colour
        else if(!emptyAnnounced){ emptyAnnounced=true; sputter(); showHint('Both dry — go find another can out behind the machine.'); }
      }
    } else if(curStroke){ endStroke(); }                   // released spray → finalise the stroke
    if(hissGain && actx) hissGain.gain.setTargetAtTime((hasCan && spraying && paint>0)?0.13:0.0, actx.currentTime, 0.03);

    // vending machine: greet on approach, then offer chat while near
    const md = planarDist(MACHINE_POS);
    nearMachine = md < 7;
    if(!greeted && md < 7){
      greeted=true;
      speak("Hello young gentlebot, what can I do you for today sir?", MOBILE ? "▸ Tap Talk to chat with me." : "▸ Press T to talk to me.");
    }
    if(MOBILE){
      const tb=$('talkBtn'); tb.style.display=(nearMachine||talking)?'block':'none'; tb.textContent=talking?'Leave':'Talk';
      if(nearMachine && !talking) showHint('tap Talk to chat');
      else if(!talking && md>12 && dlg.style.opacity!=='0') dlg.style.opacity=0;
    } else if(nearMachine && !talking){ showHint('Press  T  to talk'); }
    else if(!talking && md > 12 && dlg.style.opacity!=='0'){ dlg.style.opacity=0; }
  }

  // ================= FIRST-PERSON BUILDER — "Quake with paint" (Stage 1: conjure & place) =================
  const BSHAPES=['box','wall','plane','cylinder','cone','pyramid','sphere'];
  const BASE={ plane:{w:2,d:2}, wall:{w:2,h:2.4,t:0.15}, box:{w:1.4,h:1.4,d:1.4}, cylinder:{r:0.7,h:1.6}, sphere:{r:0.9}, cone:{r:0.9,h:1.7}, pyramid:{r:1.0,h:0.9} };
  function coneDiskUV(geo,H){ const g0=geo.groups[0], idx=geo.index, pos=geo.attributes.position, uv=geo.attributes.uv, done=new Set();
    for(let i=g0.start;i<g0.start+g0.count;i++){ const vi=idx.getX(i); if(done.has(vi))continue; done.add(vi);
      const x=pos.getX(vi),y=pos.getY(vi),z=pos.getZ(vi), t=(y+H/2)/H, a=Math.atan2(z,x), rho=(1-t)*0.49;
      uv.setXY(vi, 0.5+rho*Math.cos(a), 0.5+rho*Math.sin(a)); } uv.needsUpdate=true; }
  function bgeomFor(type,p){ p=p||BASE[type]||{};
    switch(type){
      case 'plane':    return new THREE.PlaneGeometry(p.w||2,p.d||2).rotateX(-Math.PI/2);
      case 'wall':     return new THREE.BoxGeometry(p.w||2,p.h||2.4,p.t||0.15).translate(0,(p.h||2.4)/2,0);
      case 'box':      return new THREE.BoxGeometry(p.w||1.4,p.h||1.4,p.d||1.4).translate(0,(p.h||1.4)/2,0);
      case 'cylinder': return new THREE.CylinderGeometry(p.r||0.7,p.r||0.7,p.h||1.6,40).translate(0,(p.h||1.6)/2,0);
      case 'sphere':   return new THREE.SphereGeometry(p.r||0.9,40,28).translate(0,p.r||0.9,0);
      case 'cone':     { const c=new THREE.ConeGeometry(p.r||0.9,p.h||1.7,40); coneDiskUV(c,p.h||1.7); return c.translate(0,(p.h||1.7)/2,0); }
      case 'pyramid':  { const H=p.h||0.9, g=new THREE.ConeGeometry(p.r||1.0,H,4).rotateY(Math.PI/4); coneDiskUV(g,H); return g.translate(0,H/2,0); }
    } return new THREE.BoxGeometry(1,1,1); }
  function ghostMesh(type){ const geo=bgeomFor(type);
    const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x13203a,transparent:true,opacity:0.5,roughness:.7,metalness:.1,emissive:0x1a2c50,emissiveIntensity:.6,side:THREE.DoubleSide,fog:false}));
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,32),new THREE.LineBasicMaterial({color:0x5fa0e0,transparent:true,opacity:0.65,fog:false})));
    m.userData={type,grow:0,target:new THREE.Vector3(1,1,1)}; return m; }
  const bShapes=[]; let heldGhost=null; const _fwd=new THREE.Vector3(), _brc=new THREE.Raycaster();
  function placePoint(){ _fwd.set(0,0,-1).applyQuaternion(camera.quaternion); _brc.set(camera.position,_fwd);
    const h=_brc.intersectObject(ground)[0];
    if(h && h.distance<44) return h.point.clone();
    return camera.position.clone().addScaledVector(_fwd,6).setY(0); }
  const _vsc=new THREE.Vector3();
  function conjure(type){ heldGhost=null;               // lock any previously-held ghost where it is
    const m=ghostMesh(type); const p=placePoint(); m.position.set(p.x,0,p.z); m.scale.setScalar(0.12);
    scene.add(m); bShapes.push(m); heldGhost=m; document.body.classList.add('holding');
    if(shaping){ buildShapeTools(type); return; }         // panel's open — just refresh its controls for the new shape
    showHint(MOBILE?'look to place · ◆ make to reshape · spray to make it real':'look to place · scroll to resize · E to reshape · spray to make it real'); }

  // ---------- full shape control (per-axis / uniform / rotate) over the HELD ghost ----------
  const AXES={ box:[['W','x'],['H','y'],['D','z']], wall:[['W','x'],['H','y'],['T','z']],
    plane:[['W','x'],['D','z']], cylinder:[['R','xz'],['H','y']],
    cone:[['R','xz'],['H','y']], pyramid:[['R','xz'],['H','y']], sphere:[['Size','xyz']] };
  function scaleAxis(axis,f){ const t=heldGhost&&heldGhost.userData.target; if(!t)return;
    if(axis.indexOf('x')>=0) t.x=Math.max(0.25,Math.min(6,t.x*f));
    if(axis.indexOf('y')>=0) t.y=Math.max(0.25,Math.min(6,t.y*f));
    if(axis.indexOf('z')>=0) t.z=Math.max(0.25,Math.min(6,t.z*f)); }
  function scaleAll(f){ const t=heldGhost&&heldGhost.userData.target; if(!t)return;
    const mx=Math.max(t.x,t.y,t.z), mn=Math.min(t.x,t.y,t.z);
    if(f>1) f=Math.min(f,6/mx); else f=Math.max(f,0.25/mn); t.multiplyScalar(f); }
  function rotY(d){ if(heldGhost) heldGhost.rotation.y+=d; }
  function lean(d){ if(heldGhost) heldGhost.rotation.x+=d; }
  function resetShape(){ if(!heldGhost)return; heldGhost.userData.target.set(1,1,1); heldGhost.rotation.set(0,0,0); }
  el.addEventListener('wheel', e=>{ if(heldGhost){ e.preventDefault(); scaleAll(e.deltaY<0?1.1:1/1.1); } }, {passive:false});   // scroll = quick uniform resize

  // the pop-in side panel
  let shaping=false;
  function sbtn(txt,fn,cls){ const b=document.createElement('div'); b.className='sb'+(cls?' '+cls:''); b.textContent=txt; b.addEventListener('click',fn); return b; }
  function buildShapeTools(type){
    const box=document.getElementById('shapeTools'); box.innerHTML='';
    // --- MAKE: pick a shape to manifest ahead of you ---
    const mh=document.createElement('div'); mh.className='mkhdr'; mh.textContent='make'; box.appendChild(mh);
    const grid=document.createElement('div'); grid.className='mkgrid';
    BSHAPES.forEach((s,i)=>{ const b=document.createElement('div');
      b.className='pbtn'+(heldGhost&&heldGhost.userData.type===s?' on':'');
      b.innerHTML='<b>'+(i+1)+'</b>'+s; b.addEventListener('click',()=>conjure(s)); grid.appendChild(b); });
    box.appendChild(grid);
    if(heldGhost){                                          // --- SHAPE: tune the held ghost before you paint it solid ---
      const sh=document.createElement('div'); sh.className='mkhdr'; sh.textContent='shape'; box.appendChild(sh);
      (AXES[type]||[]).forEach(([label,axis])=>{ const row=document.createElement('div'); row.className='srow';
        row.appendChild(sbtn('−',()=>scaleAxis(axis,1/1.12)));
        const s=document.createElement('span'); s.textContent=label; row.appendChild(s);
        row.appendChild(sbtn('+',()=>scaleAxis(axis,1.12))); box.appendChild(row); });
      const u=document.createElement('div'); u.className='srow';
      u.appendChild(sbtn('⊖',()=>scaleAll(1/1.12)));
      const us=document.createElement('span'); us.textContent='size'; us.style.width='auto'; u.appendChild(us);
      u.appendChild(sbtn('⊕',()=>scaleAll(1.12))); box.appendChild(u);
      const r=document.createElement('div'); r.className='srow';
      r.appendChild(sbtn('↺',()=>rotY(-Math.PI/12))); r.appendChild(sbtn('↻',()=>rotY(Math.PI/12)));
      r.appendChild(sbtn('◣',()=>lean(Math.PI/12)));  r.appendChild(sbtn('◢',()=>lean(-Math.PI/12))); box.appendChild(r);
      const d=document.createElement('div'); d.className='srow'; d.appendChild(sbtn('⎌ reset',resetShape,'wide')); box.appendChild(d);
    }
    const done=document.createElement('div'); done.className='srow';
    done.appendChild(sbtn(heldGhost?'✓ done':'✕ close',closeShape,'done')); box.appendChild(done);
  }
  function openShape(){ shaping=true; document.body.classList.add('shaping'); buildShapeTools(heldGhost?heldGhost.userData.type:null);
    if(viewCan) viewCan.visible=false;                    // put the can away — you're making/shaping, not painting
    if(!MOBILE) document.exitPointerLock(); }
  function closeShape(){ shaping=false; document.body.classList.remove('shaping');
    if(viewCan) viewCan.visible=true;                     // can's back out — a spray will now make it solid
    if(!MOBILE) el.requestPointerLock(); }
  addEventListener('keydown', e=>{ if(e.code==='KeyE' && buildUnlocked && !talking && !keepOpen){ e.preventDefault(); shaping?closeShape():openShape(); } });
  document.getElementById('shapeTab').addEventListener('click', openShape);
  function dropGrab(){                                    // unfocus: drop the held ghost, OR grab the unpainted one under the crosshair
    if(heldGhost){ heldGhost=null; document.body.classList.remove('holding');
      showHint(MOBILE?'dropped — aim at it, tap Hold to move/reshape · spray to make it real':'dropped — walk around · aim + G to move/reshape · spray to make it real'); }
    else { ray.setFromCamera(CENTER,camera); const h=ray.intersectObjects(bShapes,false)[0];
      if(h && h.object && !h.object.userData.painted){ heldGhost=h.object; document.body.classList.add('holding'); openShape(); } }   // grab AND open the shape HUD
    const gb=document.getElementById('grabBtn'); if(gb) gb.textContent = heldGhost ? 'Drop' : 'Hold';
  }
  addEventListener('keydown', e=>{ if(e.code==='KeyG' && buildUnlocked && !talking && !shaping && !keepOpen){ e.preventDefault(); dropGrab(); } });

  // ---------- top "Keep / Immortalize" HUD — save, reload, and (soon) mint your world ----------
  let keepOpen=false;
  const _kNote=()=>document.getElementById('kNote');
  function openKeep(){ keepOpen=true; document.body.classList.add('keep'); _kNote().textContent='';
    if(viewCan) viewCan.visible=false; if(!MOBILE) document.exitPointerLock(); }
  function closeKeep(){ keepOpen=false; document.body.classList.remove('keep');
    if(viewCan) viewCan.visible=true; if(!MOBILE) el.requestPointerLock(); }
  document.getElementById('keepTab').addEventListener('click', openKeep);
  document.getElementById('kDone').addEventListener('click', closeKeep);
  document.getElementById('kSave').addEventListener('click', ()=>{ saveWorld(); _kNote().textContent='Saved to this device.'; });
  document.getElementById('kReload').addEventListener('click', ()=>{ saveWorld(); location.reload(); });
  document.getElementById('kMint').addEventListener('click', ()=>{
    _kNote().textContent='Your world is already yours — saved right here. Making it immortal on-chain, where no one can claw it back, is coming next.'; });

  // ---------- paint onto a manifested shape (aim the crosshair at it + spray = it solidifies) ----------
  const TEXS=1024, EARN_PAY=111;   // paint a solidified shape ~halfway → earn a can's worth (111 sats)
  function paintCanvas(){ const c=document.createElement('canvas'); c.width=c.height=TEXS; return c; }
  function solidify(mesh){
    if(mesh.userData.surfaces) return;
    const geo=mesh.geometry, hasGroups=geo.groups.length>0;
    const used=hasGroups?geo.groups.map(g=>g.materialIndex):[0], maxMi=Math.max(0,...used);
    const surfaces=[], mats=[];
    for(let mi=0;mi<=maxMi;mi++){ const cvs=paintCanvas();
      const tex=new THREE.CanvasTexture(cvs); tex.anisotropy=4;
      surfaces[mi]={cvs, ctx:cvs.getContext('2d'), tex};
      mats[mi]=new THREE.MeshStandardMaterial({ color:0x0c1526, transparent:true, opacity:0.6, roughness:.75, metalness:.1, emissive:0xffffff, emissiveMap:tex, emissiveIntensity:1.0, side:THREE.DoubleSide, fog:false }); }
    mesh.material = hasGroups?mats:mats[0];
    mesh.userData.surfaces=surfaces;
    geo.computeBoundingBox(); const bb=geo.boundingBox, sx=bb.max.x-bb.min.x, sy=bb.max.y-bb.min.y, sz=bb.max.z-bb.min.z;
    mesh.userData.earnAt=Math.max(25, Math.min(120, 2*(sx*sy+sy*sz+sx*sz)*3.8));   // ~half-cover threshold, scales with the shape's size
  }
  function materializeShape(mesh){ if(mesh.userData.painted)return; mesh.userData.painted=true;   // first fleck: ghost → solid & committed
    (Array.isArray(mesh.material)?mesh.material:[mesh.material]).forEach(mt=>{ mt.transparent=false; mt.opacity=1; mt.needsUpdate=true; }); }
  function sprayShapeAt(surface, u, v, dn){                          // explicit u,v,dn so it replays without a camera; rnd() = seeded splatter
    const ctx=surface.ctx, x=u*TEXS, y=(1-v)*TEXS;
    const R=24*(0.6+dn*2.2), core=0.6*(1-dn*0.5);
    const c=new THREE.Color(COLORS[colorIdx]), cr=c.r*255|0, cg=c.g*255|0, cb=c.b*255|0;
    ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(x,y,0,x,y,R);
    g.addColorStop(0,'rgba('+cr+','+cg+','+cb+','+core+')'); g.addColorStop(0.5,'rgba('+cr+','+cg+','+cb+','+(core*0.35)+')'); g.addColorStop(1,'rgba('+cr+','+cg+','+cb+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.fill();
    const drops=4+(dn*40|0);
    for(let i=0;i<drops;i++){ const a=rnd()*7, base=rnd()*R*(1.1+dn*1.5), rr=1+rnd()*(2+dn*4);
      ctx.fillStyle='rgba('+cr+','+cg+','+cb+','+(0.1+rnd()*0.2)+')';
      ctx.beginPath(); ctx.arc(x+Math.cos(a)*base, y+Math.sin(a)*base, rr,0,7); ctx.fill(); }
    ctx.globalCompositeOperation='source-over';
    surface.tex.needsUpdate=true;
  }

  // ---------- seeded RNG + stroke recording (save/resume + mint-faithful replay) ----------
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  let _rng = Math.random;
  function seedRand(s){ _rng = mulberry32(s>>>0); }
  function rnd(){ return _rng(); }
  const groundStrokes = [];
  let curStroke=null, curKey=null, _lu=-9, _lv=-9;
  function targetKey(t,si){ return t==='ground' ? 'g' : (t.uuid+':'+(si||0)); }
  function beginStroke(target, si){
    const seed=(Math.random()*4294967296)>>>0;
    seedRand(seed); lastPx=null; dwell=0; _lu=_lv=-9;
    curStroke={ target, si:(si||0), c:colorIdx, seed, dabs:[] };
    curKey=targetKey(target, si);
  }
  function addDab(u,v,dn){                                           // decimate; spray only on a recorded dab so live == replay
    if(!curStroke) return false;
    const moved = curStroke.dabs.length ? Math.hypot(u-_lu, v-_lv) : 1;
    if(curStroke.dabs.length && moved<0.006) return false;
    curStroke.dabs.push([+u.toFixed(4), +v.toFixed(4), +dn.toFixed(3)]); _lu=u; _lv=v; return true;
  }
  function endStroke(){
    if(curStroke && curStroke.dabs.length){
      if(curStroke.target==='ground') groundStrokes.push({c:curStroke.c, seed:curStroke.seed, dabs:curStroke.dabs});
      else (curStroke.target.userData.strokes || (curStroke.target.userData.strokes=[])).push({si:curStroke.si, c:curStroke.c, seed:curStroke.seed, dabs:curStroke.dabs});
      scheduleSave();
    }
    curStroke=null; curKey=null;
  }
  // scheduleSave() + the save/load system live with world-storage, below.
  function unlockBuild(){ if(buildUnlocked)return; buildUnlocked=true;   // the can IS the kit — reveal everything at once
    walletEl.style.opacity=1; renderWallet();          // wallet balance
    invEl.style.display='flex'; invEl.style.opacity=1; renderInv();   // your 2 colours + how much of each is left
    document.body.classList.add('building');
    showHint(MOBILE?'tap ◆ make on the right to manifest a shape':'press 1–7 (or ◆ make, right) to manifest a shape'); }
  addEventListener('keydown',e=>{ if(!buildUnlocked||talking)return; const n=e.code.match(/^Digit([1-7])$/); if(n) conjure(BSHAPES[+n[1]-1]); });
  function bTick(){
    if(heldGhost && !shaping && !keepOpen){ const p=placePoint(); heldGhost.position.x=p.x; heldGhost.position.z=p.z; }   // follows gaze (frozen while shaping / keep panel open)
    for(const m of bShapes){ const u=m.userData; const t=u.target;
      if(u.grow<1){ u.grow=Math.min(1,u.grow+0.09); const e=1-Math.pow(1-u.grow,3); _vsc.copy(t).multiplyScalar(0.12+0.88*e); m.scale.copy(_vsc); }
      else m.scale.copy(t); } }

  // ---------- world storage & recall (strokes → localStorage; the WORLD persists, the droid wakes fresh) ----------
  const SAVE_KEY='grafverse-world-v1';
  function serializeWorld(){
    const shapes=[];
    for(const m of bShapes){ const st=m.userData.strokes; if(!st||!st.length) continue;   // only painted (owned) shapes
      shapes.push({ t:m.userData.type,
        p:[+m.position.x.toFixed(3),+m.position.y.toFixed(3),+m.position.z.toFixed(3)],
        r:[+m.rotation.x.toFixed(4),+m.rotation.y.toFixed(4),+m.rotation.z.toFixed(4)],
        s:[+m.userData.target.x.toFixed(3),+m.userData.target.y.toFixed(3),+m.userData.target.z.toFixed(3)],
        paid:!!m.userData.paid, st }); }
    return { v:1, ground:groundStrokes, shapes };
  }
  function saveWorld(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(serializeWorld())); }catch(e){} }
  let _saveT=null;
  function scheduleSave(){ if(_saveT) clearTimeout(_saveT); _saveT=setTimeout(saveWorld, 1200); }
  addEventListener('beforeunload', saveWorld);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveWorld(); });
  function loadWorld(){
    let data; try{ data=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){ data=null; }
    if(!data) return;
    (data.shapes||[]).forEach(sd=>{
      const m=ghostMesh(sd.t);
      m.position.set(sd.p[0],sd.p[1],sd.p[2]);
      m.rotation.set(sd.r[0],sd.r[1],sd.r[2]);
      m.userData.target.set(sd.s[0],sd.s[1],sd.s[2]); m.scale.copy(m.userData.target); m.userData.grow=1;   // already real — skip grow-in
      solidify(m);
      (sd.st||[]).forEach(stroke=>{ const surf=m.userData.surfaces[stroke.si]; if(!surf) return;
        colorIdx=stroke.c; seedRand(stroke.seed>>>0);                 // deterministic replay
        for(const d of stroke.dabs) sprayShapeAt(surf, d[0], d[1], d[2]); });
      materializeShape(m);
      m.userData.painted=true; m.userData.paid=!!sd.paid; m.userData.strokes=sd.st||[];
      scene.add(m); bShapes.push(m);
    });
    (data.ground||[]).forEach(stroke=>{
      colorIdx=stroke.c; seedRand(stroke.seed>>>0); lastPx=null; dwell=0;
      for(const d of stroke.dabs) spray({x:d[0], y:d[1]});
      groundStrokes.push(stroke);
    });
  }
  loadWorld();

  // ---------- loop ----------
  function tick(){
    const dt = Math.min(clock.getDelta(), 0.05);
    update(dt);
    bTick();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
