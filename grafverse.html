<style>

  *{margin:0;padding:0;box-sizing:border-box;}

  /* --- HUD overlays --- */

           pointer-events:none;opacity:0;transition:opacity .3s;}
  #hint{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);
        font-size:15px;letter-spacing:.02em;color:#cfe0ff;text-shadow:0 1px 6px #000;

        backdrop-filter:blur(4px);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .4s;}

  #meterWrap{position:fixed;left:24px;bottom:24px;width:190px;opacity:0;transition:opacity .4s;pointer-events:none;}

  #meterBar{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;}
  #meterFill{height:100%;width:100%;border-radius:6px;background:#38e1ff;transition:width .08s linear, background .2s;}

  #swatches{position:fixed;left:24px;bottom:70px;display:flex;gap:8px;opacity:0;transition:opacity .4s;pointer-events:none;}
  .sw{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.25);transition:transform .12s, border-color .12s;}
  .sw.on{border-color:#fff;transform:scale(1.25);}

  /* --- wallets (custodial vs black-market) --- */
  #wallet{position:fixed;right:20px;top:18px;min-width:214px;opacity:0;transition:opacity .5s;pointer-events:none;
    font:12px/1.4 system-ui;color:#cfe0ff;text-align:right;text-shadow:0 1px 4px #000;}
  #wallet .wrow{display:flex;justify-content:space-between;gap:14px;align-items:baseline;}
  #wallet .wname{letter-spacing:.05em;color:#9fb4d8;}
  #wallet .wval{font-weight:700;}

  #wallet .wmeta{font-size:10px;color:#6f86ad;margin:1px 0 9px;letter-spacing:.03em;}
  #wallet .wrow.blk .wname{color:#c98bd0;}
  #wallet .wrow.blk .wval{color:#c98bd0;font-weight:600;font-size:11px;}
  #wallet .wmeta.blk{color:#7a5a86;}

  .pbtn b{color:#6fd3ff;margin-right:4px;}
  .pbtn:active,.pbtn.on{background:rgba(56,120,210,.95);border-color:#8fd0ff;}
  /* --- two-colour paint inventory (leftover can + full can) --- */
  /* --- left-edge "kit" inventory HUD (cans now; more item types later) --- */
  #inv{position:fixed;left:0;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:8px;z-index:6;
    background:rgba(8,14,26,.9);border:1px solid rgba(120,170,255,.3);border-left:none;border-radius:0 14px 14px 0;
    padding:12px 14px;opacity:0;transition:opacity .4s;pointer-events:auto;}
  body.mtalk #inv, body.keep #inv{opacity:0;pointer-events:none;}
  .invhdr{font:700 10px system-ui;letter-spacing:.2em;text-transform:uppercase;color:#7f95bb;text-align:center;margin-bottom:1px;}
  .islot{display:flex;align-items:center;gap:8px;pointer-events:auto;cursor:pointer;opacity:.5;transition:opacity .15s;}
  .islot.on{opacity:1;}
  .idot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.3);flex:none;}
  .islot.on .idot{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.5);}
  .ibar{width:104px;height:10px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;}
  .ifill{height:100%;border-radius:6px;transition:width .08s linear;}
  .iamt{font:600 11px system-ui;color:#cfe0ff;width:34px;font-variant-numeric:tabular-nums;}

  #shapePanel{position:fixed;right:-260px;top:50%;transform:translateY(-50%);width:206px;z-index:9;

  body.shaping #shapePanel{right:0;pointer-events:auto;}

  .mkgrid{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;}

  /* --- top "Keep / Immortalize" HUD --- */
  #keepTab{position:fixed;top:0;left:50%;transform:translateX(-50%);display:none;z-index:8;

  body.building #keepTab{display:block;}
  body.mtalk #keepTab, body.shaping #keepTab, body.keep #keepTab{display:none;}
  #keepPanel{position:fixed;top:-360px;left:50%;transform:translateX(-50%);width:min(300px,92vw);z-index:9;
    background:rgba(8,14,26,.95);border:1px solid rgba(120,170,255,.35);border-radius:0 0 16px 16px;border-top:none;

  body.keep #keepPanel{top:0;pointer-events:auto;}

  .kbtn{padding:12px 14px;border-radius:12px;background:rgba(24,46,82,.95);border:1px solid rgba(120,170,255,.45);
    color:#eaf6ff;font:600 14px system-ui;text-align:center;cursor:pointer;pointer-events:auto;}

  #dsub{margin-top:10px;font-size:13px;color:#8fa6cc;font-style:italic;}

  #joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;

  #sprayBtn{position:fixed;right:28px;bottom:36px;width:104px;height:104px;border-radius:50%;

  #grabBtn{position:fixed;left:28px;bottom:172px;display:none;padding:12px 18px;border-radius:22px;   /* clears the movement joystick below */

  body.mtalk #grabBtn, body.keep #grabBtn{display:none!important;}
  body.shaping #sprayBtn,                                            /* no painting inside the editor */
  body.keep #sprayBtn{display:none!important;}                       /* no firing while keeping */
  #talkBtn{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);display:none;
    padding:12px 26px;border-radius:24px;background:rgba(8,16,30,.85);border:1px solid rgba(120,170,255,.55);
    color:#eaf6ff;font:600 14px system-ui;letter-spacing:.14em;text-transform:uppercase;pointer-events:auto;
    user-select:none;-webkit-user-select:none;}
  #chips{position:fixed;left:0;right:0;bottom:0;display:none;flex-direction:column;gap:8px;
    align-items:center;max-height:34vh;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;z-index:7;pointer-events:auto;padding:12px 14px 18px;
    background:linear-gradient(to top,rgba(4,6,12,.82),rgba(4,6,12,0));}
  .chip{width:min(420px,88%);text-align:center;padding:12px 16px;border-radius:14px;
    background:rgba(18,36,68,.95);border:1px solid rgba(120,170,255,.5);color:#eaf6ff;
    font:600 15px system-ui;white-space:normal;user-select:none;-webkit-user-select:none;}
  .chip:active{background:rgba(56,120,210,.95);}
  body.mtalk #chips{display:flex;}

  body.keep #joyBase{display:none!important;}          /* no walking while the Keep panel is open */
  body.mtalk #talkBtn{top:14px;bottom:auto;left:auto;right:14px;transform:none;}

  /* --- splash --- */
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:18px;background:radial-gradient(ellipse at center,#0a1226 0%,#000 70%);z-index:10;cursor:pointer;
          transition:opacity .6s;}
  #splash h1{font-size:clamp(42px,9vw,96px);font-weight:800;letter-spacing:-.02em;
             background:linear-gradient(180deg,#eaf2ff,#6fb6ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #splash .tag{font-size:15px;color:#7fa6df;letter-spacing:.04em;}
  #splash .go{margin-top:22px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#cfe0ff;
              padding:12px 26px;border:1px solid rgba(140,180,255,.4);border-radius:30px;}
  #splash .creed{position:absolute;bottom:26px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#3f5a86;}
  .hidden{opacity:0!important;pointer-events:none!important;}
  #tag2{font-size:13px;color:#5f7bab;font-style:italic;}
</style>

<script type="module">
import * as THREE from 'three';
window.THREE = THREE;   // keep the existing global-THREE guard + window.THREE references working
(function(){
  "use strict";
  if(!window.THREE){ document.getElementById('tag2').textContent = "⚠ three.js module failed to load (serve over http, not file://)."; return; }

  // ---------- config ----------
  const COLORS = [0x38e1ff, 0xff3ea5, 0x7CFC00, 0xffe94d, 0xff7a00];
  const EYE = 1.7, SPEED = 2.1, SENS = 0.0022, PITCH_MAX = 1.45;
  const JUMP_V = 6.2, GRAV = -7.5;   // jump impulse (units/s) + LOW moon gravity — floaty double-height hop, ~2.6 units peak (was ~1.3)
  // slope-slide EXPERIMENT — dial by feel:  REST_ANGLE = steepest you can hold (rad, 0.60≈34°) · SLIDE_G = downhill pull · SLIDE_FRIC/AIR_FRIC = per-frame slide damping (1=frictionless, lower=grippier)
  const REST_ANGLE = 0.60, SLIDE_G = 22, SLIDE_FRIC = 0.94, AIR_FRIC = 0.995;
  const WET_REST = 0.42, WET_FRIC = 0.985;   // WET paint = slippier: slips at a gentler angle (~24°) + slides further
  const GROUND = 500;          // ground plane size (units)
  const TEX = 2048;            // paint canvas resolution
  const PAINT_DRAIN = 0.22;    // per frame while spraying
  const CAN_POS = new THREE.Vector3(0, 0.35, -9);      // first can, a few steps ahead
  const MACHINE_POS = new THREE.Vector3(3, 0, -26);    // the glowing box in the (nearer) distance
  const MACHINE_STOCK = 6;                             // cans behind the glass (set 0 for an empty machine)
  const MOBILE = window.matchMedia('(pointer: coarse)').matches;  // touch-primary device
  let moveF = 0, moveS = 0;                            // mobile joystick: forward/back (F) + strafe (S), analog −1..1
  if(MOBILE){ const _go=document.querySelector('#splash .go'); if(_go) _go.textContent='Tap to begin'; }

  // ---------- renderer / scene / camera ----------
  const app = document.getElementById('app');
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  app.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000006);
  scene.fog = new THREE.FogExp2(0x000006, 0.0016);

  const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 5000);
  camera.rotation.order = 'YXZ';
  camera.position.set(0, EYE, 0);
  scene.add(camera);

  scene.add(new THREE.AmbientLight(0x2a3350, 0.6));   // cool space fill (earthshine)
  // ---------- the sun: one hard, distant, parallel light in a black sky (real-Moon lighting) ----------
  const sunDir = new THREE.Vector3(0.32, 0.82, 0.47).normalize();
  const key = new THREE.DirectionalLight(0xfff4ea, 1.05);          // warm-white sunlight
  key.position.copy(sunDir).multiplyScalar(120); scene.add(key);

  // ---------- starfield (you are floating in space) ----------
  (function stars(){
    const N = 3500, pos = new Float32Array(N*3);
    for(let i=0;i<N;i++){
      // random point on a shell
      const r = 700 + Math.random()*1600;
      const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
      pos[i*3]   = r*Math.sin(p)*Math.cos(t);
      pos[i*3+1] = r*Math.cos(p);
      pos[i*3+2] = r*Math.sin(p)*Math.sin(t);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    const m = new THREE.PointsMaterial({ color:0xffffff, size:2.2, sizeAttenuation:true, transparent:true, opacity:.9, depthWrite:false, fog:false });
    scene.add(new THREE.Points(g,m));
  })();

  // ---------- the sun disc, hanging in the black sky (matches the sunlight direction) ----------
  (function sunDisc(){
    const S=256, cv=document.createElement('canvas'); cv.width=cv.height=S; const g=cv.getContext('2d');
    const grd=g.createRadialGradient(S/2,S/2,0, S/2,S/2,S/2);
    grd.addColorStop(0,'rgba(255,255,255,1)');   grd.addColorStop(.18,'rgba(255,248,232,1)');
    grd.addColorStop(.42,'rgba(255,235,198,.5)'); grd.addColorStop(.75,'rgba(255,221,170,.1)'); grd.addColorStop(1,'rgba(255,221,170,0)');
    g.fillStyle=grd; g.fillRect(0,0,S,S);
    const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace;
    const spr=new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false }));
    spr.position.copy(sunDir).multiplyScalar(1400); spr.scale.setScalar(280); scene.add(spr);
  })();

  // ---------- the paintable ground (invisible until painted) ----------
  const pc = document.createElement('canvas'); pc.width = pc.height = TEX;
  const pctx = pc.getContext('2d');
  pctx.clearRect(0,0,TEX,TEX);                 // fully transparent => void
  const paintTex = new THREE.CanvasTexture(pc);
  paintTex.anisotropy = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(GROUND, GROUND),
    new THREE.MeshBasicMaterial({ map:paintTex, transparent:true, depthWrite:false })
  );
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  // helper: uv -> canvas px
  function toPx(uv){ return { x: uv.x*TEX, y:(1-uv.y)*TEX }; }

  // spray a glowing splat (additive within the canvas so overlaps go white-hot).
  // dwell = how long you've lingered on one spot → paint pools & spatters (rewards a confident stroke).
  let lastPx=null, dwell=0;
  let soleColor=null, soleCharge=0;            // wet paint picked up on the soles → tracked footprints
  function spray(uv){
    const {x,y} = toPx(uv);
    if(lastPx){ const dd=Math.hypot(x-lastPx.x, y-lastPx.y);
      dwell = dd<18 ? Math.min(1, dwell+0.06) : Math.max(0, dwell-0.14); }
    lastPx={x,y};
    const col = new THREE.Color(COLORS[colorIdx]);
    const cr = (col.r*255)|0, cg=(col.g*255)|0, cb=(col.b*255)|0;
    pctx.globalCompositeOperation = 'lighter';
    const main = (32 + rnd()*8) * (1 + dwell*0.9);   // pools outward when you linger
    const core = 0.55 + dwell*0.35;                          // brighter, wetter core on dwell
    const g = pctx.createRadialGradient(x,y,0, x,y,main);
    g.addColorStop(0,   `rgba(${cr},${cg},${cb},${core})`);
    g.addColorStop(0.5, `rgba(${cr},${cg},${cb},0.22)`);
    g.addColorStop(1,   `rgba(${cr},${cg},${cb},0)`);
    pctx.fillStyle = g;
    pctx.beginPath(); pctx.arc(x,y,main,0,7); pctx.fill();
    // scattered droplets => spray-can texture; more + further as it starts to run
    const drops = 6 + (dwell*12|0);
    for(let i=0;i<drops;i++){
      const a=rnd()*7, d=rnd()*main*(1.4+dwell*1.2), rr=1+rnd()*(3+dwell*3);
      const dx=x+Math.cos(a)*d, dy=y+Math.sin(a)*d;
      pctx.fillStyle = `rgba(${cr},${cg},${cb},${0.14+rnd()*0.28})`;
      pctx.beginPath(); pctx.arc(dx,dy,rr,0,7); pctx.fill();
    }
    pctx.globalCompositeOperation = 'source-over';
    paintTex.needsUpdate = true;
  }

  // Walk through wet paint → pick it up on your soles and leave fading footprints for a few steps.
  function leaveFootprint(px, pz, vx, vz, ph){
    const u = px/GROUND + 0.5, v = 0.5 - pz/GROUND, fx = u*TEX, fy = (1-v)*TEX;
    if(fx<2 || fx>=TEX-2 || fy<2 || fy>=TEX-2) return;
    try{ const d = pctx.getImageData(fx|0, fy|0, 1, 1).data;      // stepped in wet paint? → load the soles
      if(d[3] > 22){ soleColor=[d[0],d[1],d[2]]; soleCharge=8; } }catch(_){}    // easier pickup; an 8-step trail (fades ~2× faster)
    if(soleCharge<=0 || !soleColor) return;
    const a = Math.atan2(vz, vx);                                 // walk direction (canvas space)
    const side = (ph&1)?1:-1, ox=Math.cos(a+Math.PI/2)*8*side, oy=Math.sin(a+Math.PI/2)*8*side;
    const alpha = 0.9*(soleCharge/8), back=8;                     // bold start, faster fade; sit the print BEHIND the foot, not ahead
    pctx.save(); pctx.globalCompositeOperation='lighter';        // glow like the paint so the prints POP
    pctx.translate(fx+ox, fy+oy); pctx.rotate(a);
    pctx.fillStyle = `rgba(${soleColor[0]},${soleColor[1]},${soleColor[2]},${alpha})`;
    pctx.beginPath(); pctx.ellipse(-back,0, 5,3.2, 0,0,7); pctx.fill();      // sole (smaller, trailing behind)
    pctx.beginPath(); pctx.ellipse(-back+6,0, 2.4,1.9, 0,0,7); pctx.fill();  // ball of the foot
    pctx.restore();
    soleCharge--; paintTex.needsUpdate=true;
  }

  let actx=null, hissGain=null;
  function initAudio(){
    if(actx) return;
    try{
      const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
      actx = new AC();
      const buf = actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
      const d = buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      const src = actx.createBufferSource(); src.buffer=buf; src.loop=true;
      const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1900;
      const bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=5400; bp.Q.value=0.6;
      hissGain = actx.createGain(); hissGain.gain.value=0;
      src.connect(hp); hp.connect(bp); bp.connect(hissGain); hissGain.connect(actx.destination);
      src.start();
    }catch(e){ actx=null; hissGain=null; }
  }
  function sputter(){
    if(!actx||!hissGain) return;
    const t=actx.currentTime;
    for(let i=0;i<4;i++){ hissGain.gain.setValueAtTime(0.11, t+i*0.06); hissGain.gain.setValueAtTime(0.0, t+i*0.06+0.03); }
  }

    if(!actx) return; const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.type='sine'; o.frequency.setValueAtTime(115,t); o.frequency.exponentialRampToValueAtTime(52,t+0.09);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.07,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.15);
  }

    if(!actx) return; const t=actx.currentTime, notes=[523.25,659.25,783.99,1046.5];

      g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.13,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+0.3);

  }

  // ---------- paint onto a manifested shape (aim the crosshair at it + spray = it solidifies) ----------
  const EARN_PAY=111;   // paint a solidified shape ~halfway → earn a can's worth (111 sats)
  // Each paint surface gets a canvas sized to its AREA: dim² = area × D². So a face's texel count is EXACTLY linear
  // in its area, and total world texture memory = D² × (total painted area) — independent of object count, shape, or
  // facet count. That's the property FPS maps need: memory scales with painted surface, nothing else. D is the master
  // performance/quality dial (texels per world-unit). Floor is kept tiny so many small facets don't waste VRAM; the
  // ceiling just caps a single runaway face. Brush sizes stay in TEXELS → a constant world-size brush across every face.
  // (True map-scale optimum, for the per-face-panel pass: one ATLAS texture per object — 1 material / 1 draw call —
  //  memory = object area × D², with faces as sub-rects. This per-surface version is the stepping stone.)
  const TEXEL_D=731, TEX_MIN=64, TEX_MAX=1024;   // texels/world-unit · floor · ceiling (a 1.4-unit face → 1024, as before)
  function paintCanvas(dim){ const c=document.createElement('canvas'); c.width=c.height=dim; return c; }
  const _pa=new THREE.Vector3(),_pb=new THREE.Vector3(),_pc=new THREE.Vector3(),_pab=new THREE.Vector3(),_pac=new THREE.Vector3();
  function surfaceAreas(geo){                                      // total triangle area per materialIndex (local space)
    const pos=geo.attributes.position, idx=geo.index;
    const groups=(geo.groups&&geo.groups.length)?geo.groups:[{start:0,count:(idx?idx.count:pos.count),materialIndex:0}];
    const area={};
    for(const g of groups){ let s=0; const end=g.start+g.count;
      for(let i=g.start;i<end;i+=3){
        const a=idx?idx.getX(i):i, b=idx?idx.getX(i+1):i+1, c=idx?idx.getX(i+2):i+2;
        _pa.fromBufferAttribute(pos,a); _pb.fromBufferAttribute(pos,b); _pc.fromBufferAttribute(pos,c);
        _pab.subVectors(_pb,_pa); _pac.subVectors(_pc,_pa); s+=_pab.cross(_pac).length()*0.5; }
      const mi=g.materialIndex||0; area[mi]=(area[mi]||0)+s; }
    return area;
  }
  function solidify(mesh){
    if(mesh.userData.surfaces) return;
    const geo=mesh.geometry, hasGroups=geo.groups.length>0;
    const used=hasGroups?geo.groups.map(g=>g.materialIndex):[0], maxMi=Math.max(0,...used);
    const area=surfaceAreas(geo);
    const surfaces=[], mats=[];
    for(let mi=0;mi<=maxMi;mi++){
      const dim=Math.max(TEX_MIN, Math.min(TEX_MAX, Math.round(Math.sqrt(area[mi]||0.04)*TEXEL_D)));   // canvas ∝ √(face area)
      const cvs=paintCanvas(dim);
      const tex=new THREE.CanvasTexture(cvs); tex.anisotropy=4;
      surfaces[mi]={cvs, ctx:cvs.getContext('2d'), tex};
      mats[mi]=new THREE.MeshStandardMaterial({ color:(mesh.userData.base!=null?mesh.userData.base:0x0c1526), transparent:true, opacity:0.6, roughness:.75, metalness:.1, emissive:0xffffff, emissiveMap:tex, emissiveIntensity:1.0, side:THREE.DoubleSide, fog:false }); }
    mesh.material = hasGroups?mats:mats[0];
    mesh.userData.surfaces=surfaces;
    geo.computeBoundingBox(); const bb=geo.boundingBox, sx=bb.max.x-bb.min.x, sy=bb.max.y-bb.min.y, sz=bb.max.z-bb.min.z;
    mesh.userData.earnAt=Math.max(25, Math.min(120, 2*(sx*sy+sy*sz+sx*sz)*3.8));   // ~half-cover threshold, scales with the shape's size
  }
  function materializeShape(mesh){ if(mesh.userData.painted)return; mesh.userData.painted=true;   // first fleck: ghost → solid & committed
    (Array.isArray(mesh.material)?mesh.material:[mesh.material]).forEach(mt=>{ mt.transparent=false; mt.opacity=1; mt.needsUpdate=true; }); }
  function sprayShapeAt(surface, u, v, dn){                          // explicit u,v,dn so it replays without a camera; rnd() = seeded splatter
    const ctx=surface.ctx, S=surface.cvs.width, x=u*S, y=(1-v)*S;
    const R=24*(0.6+dn*2.2), core=0.6*(1-dn*0.5);
    const c=new THREE.Color(COLORS[colorIdx]), cr=c.r*255|0, cg=c.g*255|0, cb=c.b*255|0;
    ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(x,y,0,x,y,R);
    g.addColorStop(0,'rgba('+cr+','+cg+','+cb+','+core+')'); g.addColorStop(0.5,'rgba('+cr+','+cg+','+cb+','+(core*0.35)+')'); g.addColorStop(1,'rgba('+cr+','+cg+','+cb+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.fill();
    const drops=4+(dn*40|0);
    for(let i=0;i<drops;i++){ const a=rnd()*7, base=rnd()*R*(1.1+dn*1.5), rr=1+rnd()*(2+dn*4);
      ctx.fillStyle='rgba('+cr+','+cg+','+cb+','+(0.1+rnd()*0.2)+')';
      ctx.beginPath(); ctx.arc(x+Math.cos(a)*base, y+Math.sin(a)*base, rr,0,7); ctx.fill(); }
    ctx.globalCompositeOperation='source-over';
    surface.tex.needsUpdate=true;
  }
  function sampleWet(surf,u,v){                                    // is the shape painted (=wet) here? → [r,g,b,a] or null
    try{ const S=surf.cvs.width, x=Math.max(0,Math.min(S-1,u*S|0)), y=Math.max(0,Math.min(S-1,(1-v)*S|0));
      const d=surf.ctx.getImageData(x,y,1,1).data; return d[3]>40 ? d : null; }catch(_){ return null; }
  }
  function smearShapeAt(surf, u0,v0, u1,v1, r,g,b){                // drag the wet paint along the slide path — a brush-stroke streak
    const ctx=surf.ctx, S=surf.cvs.width, x0=u0*S, y0=(1-v0)*S, x1=u1*S, y1=(1-v1)*S;
    ctx.globalCompositeOperation='source-over'; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle='rgba('+r+','+g+','+b+',0.26)'; ctx.lineWidth=34;   // soft wide smear
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    ctx.strokeStyle='rgba('+r+','+g+','+b+',0.5)';  ctx.lineWidth=13;   // brighter dragged core
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    surf.tex.needsUpdate=true;
  }

  // ---------- seeded RNG + stroke recording (save/resume + mint-faithful replay) ----------
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  let _rng = Math.random;
  function seedRand(s){ _rng = mulberry32(s>>>0); }
  function rnd(){ return _rng(); }
  const groundStrokes = [];
  let curStroke=null, curKey=null, _lu=-9, _lv=-9;
  function targetKey(t,si){ return t==='ground' ? 'g' : (t.uuid+':'+(si||0)); }
  function beginStroke(target, si){
    const seed=(Math.random()*4294967296)>>>0;
    seedRand(seed); lastPx=null; dwell=0; _lu=_lv=-9;
    curStroke={ target, si:(si||0), c:colorIdx, seed, dabs:[] };
    curKey=targetKey(target, si);
  }
  function addDab(u,v,dn){                                           // decimate; spray only on a recorded dab so live == replay
    if(!curStroke) return false;
    const moved = curStroke.dabs.length ? Math.hypot(u-_lu, v-_lv) : 1;
    if(curStroke.dabs.length && moved<0.006) return false;
    curStroke.dabs.push([+u.toFixed(4), +v.toFixed(4), +dn.toFixed(3)]); _lu=u; _lv=v; return true;
  }
  function endStroke(){
    if(curStroke && curStroke.dabs.length){
      if(curStroke.target==='ground') groundStrokes.push({c:curStroke.c, seed:curStroke.seed, dabs:curStroke.dabs});
      else (curStroke.target.userData.strokes || (curStroke.target.userData.strokes=[])).push({si:curStroke.si, c:curStroke.c, seed:curStroke.seed, dabs:curStroke.dabs});
      scheduleSave();
    }
    curStroke=null; curKey=null;
  }
  // scheduleSave() + the save/load system live with world-storage, below.
  function revealPaintHUD(){ if(paintShown)return; paintShown=true;   // the left-edge kit inventory slides in
    invEl.style.display='flex'; invEl.style.opacity=1; renderInv();
    showHint(MOBILE?'your kit (left edge) — how much paint you have left':'your kit, left edge — how much paint you have left'); }
  function unlockBuild(){ if(buildUnlocked)return; buildUnlocked=true;   // the manifest tool wakes up the builder in you
    walletEl.style.opacity=1; renderWallet();          // sats wallet
    revealPaintHUD();                                  // make sure the kit is showing too
    document.body.classList.add('building'); setMode();
    openShape();                                       // the Manifest HUD appears and the can holsters
    showHint(MOBILE?'manifest — tap a shape to place it · this was the last one\'s':'manifest — click the ground, then a shape · this was the last one\'s'); }
  addEventListener('keydown',e=>{ if(!buildUnlocked||talking||keepOpen)return; const n=e.code.match(/^Digit([1-7])$/);
    if(n){ if(!shaping) openShape(); conjure(BSHAPES[+n[1]-1]); } });   // a number opens the manifest editor and drops a shape in
  addEventListener('keydown',e=>{ if(e.code==='KeyC' && buildUnlocked && !talking && inv.length>1){ e.preventDefault();
    activeSlot=(activeSlot+1)%inv.length; syncActive(); renderInv(); } });   // C = switch to your other can
  function bTick(){
    if(heldGhost && !keepOpen && (MOBILE || !shaping)){ const p=placePoint(); heldGhost.position.x=p.x; heldGhost.position.z=p.z; }   // mobile Grab follows gaze; desktop editor drags with the cursor instead
    for(const m of bShapes){ const u=m.userData; const t=u.target;
      if(u.grow<1){ u.grow=Math.min(1,u.grow+0.09); const e=1-Math.pow(1-u.grow,3); _vsc.copy(t).multiplyScalar(0.12+0.88*e); m.scale.copy(_vsc); }
      else m.scale.copy(t); } }

  // ---------- world storage & recall (strokes → localStorage; the WORLD persists, the droid wakes fresh) ----------
  const SAVE_KEY='grafverse-world-v1';
  // ── engine shape → the frozen BMF-SOLID record (docs/BMF-SOLID-SPEC.md) — mint-time conversion ──
  // The 3-axis editor scale collapses to a UNIFORM size + proportion RATIOS; the object is ONE owned paint unit.
  const PRESET_ID = { box:122, wall:122, plane:123, cylinder:119, cone:120, pyramid:120, sphere:121 };
  function shapeToRecord(sd){
    const pr=PRESETS[sd.t]||PRESETS.box, base=pr.base, d=pr.dims, t=sd.s;            // t = 3-axis target multipliers
    let ratios=[], sizeM=1;
    if(base==='box'){ const W=(d.w||1)*t[0], H=(d.h||1)*t[1], D=(d.d||1)*t[2]; sizeM=H; ratios=[W/H, D/H]; }
    else if(base==='prism'||base==='pyramid'){ const Dia=2*(d.r||0.5)*t[0], H=(d.h||1)*t[1]; sizeM=H; ratios=[Dia/H]; }
    else if(base==='ball'){ sizeM=2*(d.r||0.9)*t[0]; ratios=[]; }                     // uniform = diameter
    else if(base==='plane'){ const W=(d.w||2)*t[0], Dp=(d.d||2)*t[2]; sizeM=Dp; ratios=[W/Dp]; }
    const rot=[sd.r[0], sd.r[1]+(pr.align||0), sd.r[2]];                              // fold the preset's canonical facing into rotation
    const color = sd.cr ? rgb332Index(sd.col!=null?sd.col:(GEMS[sd.gem]||GEMS[1]).col)   // crystal → its 8-bit (RGB332) tint
                        : rgb332Index(sd.base!=null?sd.base:0x0c1526);                       // painted → base material colour, 8-bit
    const tex   = sd.cr ? (sd.gem||1) : (sd.tex||0);                                  // material/texture — the gem id (1…16), else plain (0)
    const paint = sd.cr ? { kind:0 } : { kind:1, strokes:sd.st||[] };                 // owned paint layer (a crystal carries no strokes)
    return { id:PRESET_ID[sd.t]||122, res:sd.res||pr.res||0, ratios, pos:sd.p, rot, scale:sizeM, color, tex, paint };
  }
  function worldToRecords(world){ return { ground:world.ground||[], shapes:(world.shapes||[]).map(shapeToRecord) }; }

  function serializeWorld(){
    const shapes=[];
    for(const m of bShapes){ const u=m.userData;
      const painted = u.strokes && u.strokes.length;
      if(!painted && !u.crystal) continue;                                     // save OWNED shapes: painted OR crystallised
      const rec={ t:u.type,
        p:[+m.position.x.toFixed(3),+m.position.y.toFixed(3),+m.position.z.toFixed(3)],
        r:[+m.rotation.x.toFixed(4),+m.rotation.y.toFixed(4),+m.rotation.z.toFixed(4)],
        s:[+u.target.x.toFixed(3),+u.target.y.toFixed(3),+u.target.z.toFixed(3)],
        paid:!!u.paid };
      if(u.res) rec.res=u.res;                                                 // custom facet count (column/spire/ball)
      if(u.base!=null) rec.base=u.base;                                         // base LAYER colour (if the picker set one)
      if(u.crystal){ rec.cr=1; rec.gem=u.gemIdx|0;                             // a crystal: gem index + its drifted inner colour
        if(m.material && m.material.color) rec.col=m.material.color.getHex(); }
      else rec.st=u.strokes;                                                   // a painted shape: its strokes
      shapes.push(rec); }
    return { v:2, ground:groundStrokes, shapes };
  }
  function saveWorld(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(serializeWorld())); }catch(e){} }
  let _saveT=null;
  function scheduleSave(){ if(_saveT) clearTimeout(_saveT); _saveT=setTimeout(saveWorld, 1200); }
  addEventListener('beforeunload', saveWorld);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveWorld(); });
  function loadWorld(){
    let data; try{ data=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){ data=null; }
    if(!data) return;
    (data.shapes||[]).forEach(sd=>{
      const m=ghostMesh(sd.t);
      m.position.set(sd.p[0],sd.p[1],sd.p[2]);
      m.rotation.set(sd.r[0],sd.r[1],sd.r[2]);
      m.userData.target.set(sd.s[0],sd.s[1],sd.s[2]); m.scale.copy(m.userData.target); m.userData.grow=1;   // already real — skip grow-in
      if(sd.res) applyRes(m, sd.res);                                          // restore custom facet count (geometry) BEFORE materials
      if(sd.cr){                                                              // ── a crystal: gem material + drifted colour ──
        crystallizeShape(m, sd.gem||0);
        if(sd.col!=null && m.material.color){ m.material.color.setHex(sd.col);
          if(m.material.attenuationColor) m.material.attenuationColor.setHex(sd.col); m.material.needsUpdate=true; }
        m.userData.paid=!!sd.paid;
      } else {                                                                // ── a painted shape: replay its strokes ──
        if(sd.base!=null) m.userData.base=sd.base;                           // restore the base layer colour before solidify bakes it in
        solidify(m);
        (sd.st||[]).forEach(stroke=>{ const surf=m.userData.surfaces[stroke.si]; if(!surf) return;
          colorIdx=stroke.c; seedRand(stroke.seed>>>0);                       // deterministic replay
          for(const d of stroke.dabs) sprayShapeAt(surf, d[0], d[1], d[2]); });
        materializeShape(m);
        m.userData.painted=true; m.userData.paid=!!sd.paid; m.userData.strokes=sd.st||[];
      }
      scene.add(m); bShapes.push(m);
    });
    (data.ground||[]).forEach(stroke=>{
      colorIdx=stroke.c; seedRand(stroke.seed>>>0); lastPx=null; dwell=0;
      for(const d of stroke.dabs) spray({x:d[0], y:d[1]});
      groundStrokes.push(stroke);
    });
  }
  loadWorld();
  { const _minted = new URLSearchParams(location.search).get('minted');   // came back from the wallet after a mint
    if(_minted){ showHint('✦ Immortalized on-chain — '+_minted.slice(0,8)+'… It’s yours forever.'); try{ history.replaceState(null,'',location.pathname); }catch(_){} } }

  // ---------- loop ----------
  function tick(){
    const dt = Math.min(clock.getDelta(), 0.05);
    update(dt);
    bTick();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
