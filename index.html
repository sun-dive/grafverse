 *{box-sizing:border-box} html,body{margin:0;height:100%;background:#111}

 .tag{margin:16px 0 0;font-size:clamp(17px,2.6vw,23px);font-weight:700;max-width:26ch;line-height:1.4;color:#ececf2}
 .tag b{color:#00e5ff} .tag i{font-style:normal;color:#b6ff3a}
 .foot{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:12px;color:#8a8a97;letter-spacing:.03em}
 @media(prefers-reduced-motion:reduce){.ly{transition:none}}
