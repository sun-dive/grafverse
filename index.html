<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>grafverse — paint a moon into existence</title>
<meta name="description" content="A playable teaser from the grafverse: spawn in the void, paint a dead moon to life, and haggle with a lonely vending machine. Own what you make — no landlord, no buff.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://grafverse.com/">
<meta property="og:title" content="grafverse — paint a moon into existence">
<meta property="og:description" content="Spawn in the void, paint a dead moon to life, and chat up a weary vending machine. Own what you make — no landlord, no buff.">
<meta property="og:image" content="https://grafverse.com/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://grafverse.com/og.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎨</text></svg>">
<style>
  :root{ --fg:#eaf2ff; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#000;font-family:-apple-system,Segoe UI,Roboto,system-ui,sans-serif;color:var(--fg);}
  #app{position:fixed;inset:0;}
  canvas{display:block;}

  /* --- HUD overlays --- */
  #reticle{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
           border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 6px #fff;
           pointer-events:none;opacity:0;transition:opacity .3s;}
  #hint{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);
        font-size:15px;letter-spacing:.02em;color:#cfe0ff;text-shadow:0 1px 6px #000;
        padding:6px 14px;background:rgba(10,16,30,.35);border-radius:20px;
        backdrop-filter:blur(4px);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .4s;}

  #meterWrap{position:fixed;left:24px;bottom:24px;width:190px;opacity:0;transition:opacity .4s;pointer-events:none;}
  #meterLbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9fb4d8;margin-bottom:6px;}
  #meterBar{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;}
  #meterFill{height:100%;width:100%;border-radius:6px;background:#38e1ff;transition:width .08s linear, background .2s;}

  #swatches{position:fixed;left:24px;bottom:70px;display:flex;gap:8px;opacity:0;transition:opacity .4s;pointer-events:none;}
  .sw{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.25);transition:transform .12s, border-color .12s;}
  .sw.on{border-color:#fff;transform:scale(1.25);}

  /* --- dialogue --- */
  #dialogue{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);max-width:min(680px,92vw);
            padding:18px 22px;background:rgba(8,14,26,.82);border:1px solid rgba(120,170,255,.28);
            border-radius:14px;backdrop-filter:blur(6px);box-shadow:0 10px 40px rgba(0,0,0,.5);
            opacity:0;transition:opacity .5s;pointer-events:none;}
  #dspeaker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#6fd3ff;margin-bottom:8px;}
  #dtext{font-size:17px;line-height:1.45;color:#f3f7ff;min-height:1.4em;}
  #dsub{margin-top:10px;font-size:13px;color:#8fa6cc;font-style:italic;}
  #chatInput{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);width:min(560px,84vw);
    display:none;padding:12px 18px;font-size:16px;color:#eaf6ff;background:rgba(8,16,30,.92);
    border:1px solid rgba(120,170,255,.5);border-radius:24px;outline:none;font-family:inherit;
    box-shadow:0 8px 30px rgba(0,0,0,.55);}
  #chatInput::placeholder{color:#5f7bab;}
  html,body{overscroll-behavior:none;}
  canvas{touch-action:none;}
  #mobileUI{position:fixed;inset:0;display:none;pointer-events:none;z-index:6;}
  #joyBase{position:fixed;left:26px;bottom:26px;width:130px;height:130px;border-radius:50%;
    background:rgba(120,160,220,.10);border:1px solid rgba(150,190,255,.35);pointer-events:auto;touch-action:none;}
  #joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;
    background:rgba(180,210,255,.45);border:1px solid rgba(220,235,255,.6);transform:translate(-50%,-50%);}
  #sprayBtn{position:fixed;right:28px;bottom:36px;width:104px;height:104px;border-radius:50%;
    background:rgba(56,225,255,.16);border:2px solid rgba(120,230,255,.6);color:#dffaff;
    font:600 15px/104px system-ui;text-align:center;letter-spacing:.12em;pointer-events:auto;touch-action:none;
    text-transform:uppercase;user-select:none;-webkit-user-select:none;}
  #sprayBtn.down{background:rgba(56,225,255,.4);}
  #talkBtn{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);display:none;
    padding:12px 26px;border-radius:24px;background:rgba(8,16,30,.85);border:1px solid rgba(120,170,255,.55);
    color:#eaf6ff;font:600 14px system-ui;letter-spacing:.14em;text-transform:uppercase;pointer-events:auto;
    user-select:none;-webkit-user-select:none;}
  #chips{position:fixed;left:0;right:0;bottom:0;display:none;flex-direction:column;gap:8px;
    align-items:center;max-height:34vh;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;z-index:7;pointer-events:auto;padding:12px 14px 18px;
    background:linear-gradient(to top,rgba(4,6,12,.82),rgba(4,6,12,0));}
  .chip{width:min(420px,88%);text-align:center;padding:12px 16px;border-radius:14px;
    background:rgba(18,36,68,.95);border:1px solid rgba(120,170,255,.5);color:#eaf6ff;
    font:600 15px system-ui;white-space:normal;user-select:none;-webkit-user-select:none;}
  .chip:active{background:rgba(56,120,210,.95);}
  body.mtalk #chips{display:flex;}
  body.mtalk #dialogue{top:54px;bottom:auto;max-height:44vh;overflow-y:auto;touch-action:pan-y;pointer-events:auto;}
  body.mtalk #joyBase, body.mtalk #sprayBtn{display:none!important;}
  body.mtalk #talkBtn{top:14px;bottom:auto;left:auto;right:14px;transform:none;}

  /* --- splash --- */
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:18px;background:radial-gradient(ellipse at center,#0a1226 0%,#000 70%);z-index:10;cursor:pointer;
          transition:opacity .6s;}
  #splash h1{font-size:clamp(42px,9vw,96px);font-weight:800;letter-spacing:-.02em;
             background:linear-gradient(180deg,#eaf2ff,#6fb6ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #splash .tag{font-size:15px;color:#7fa6df;letter-spacing:.04em;}
  #splash .go{margin-top:22px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#cfe0ff;
              padding:12px 26px;border:1px solid rgba(140,180,255,.4);border-radius:30px;}
  #splash .creed{position:absolute;bottom:26px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#3f5a86;}
  .hidden{opacity:0!important;pointer-events:none!important;}
  #tag2{font-size:13px;color:#5f7bab;font-style:italic;}
</style>
</head>
<body>
<div id="app"></div>

<div id="reticle"></div>
<div id="hint"></div>

<div id="meterWrap"><div id="meterLbl">paint</div><div id="meterBar"><div id="meterFill"></div></div></div>
<div id="swatches"></div>

<div id="dialogue">
  <div id="dspeaker">Vending Machine</div>
  <div id="dtext"></div>
  <div id="dsub"></div>
</div>
<input id="chatInput" type="text" autocomplete="off" spellcheck="false" placeholder="say something to the machine…">

<div id="mobileUI">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="sprayBtn">Spray</div>
  <div id="talkBtn">Talk</div>
</div>
<div id="chips"></div>

<div id="splash">
  <h1>grafverse</h1>
  <div class="tag">You are what you paint. Paint what you are.</div>
  <div id="tag2">Nothing exists until it's painted.</div>
  <div class="go">Click to begin</div>
  <div class="creed">In the covenant we trust</div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
  "use strict";
  if(!window.THREE){ document.getElementById('tag2').textContent = "⚠ vendor/three.min.js not found next to this file."; return; }

  // ---------- config ----------
  const COLORS = [0x38e1ff, 0xff3ea5, 0x7CFC00, 0xffe94d, 0xff7a00];
  const EYE = 1.7, SPEED = 2.1, SENS = 0.0022, PITCH_MAX = 1.45;
  const GROUND = 500;          // ground plane size (units)
  const TEX = 2048;            // paint canvas resolution
  const PAINT_DRAIN = 0.22;    // per frame while spraying
  const CAN_POS = new THREE.Vector3(0, 0.35, -9);      // first can, a few steps ahead
  const MACHINE_POS = new THREE.Vector3(3, 0, -26);    // the glowing box in the (nearer) distance
  const MACHINE_STOCK = 6;                             // cans behind the glass (set 0 for an empty machine)
  const MOBILE = window.matchMedia('(pointer: coarse)').matches;  // touch-primary device
  let mWalk = false;                                   // mobile: touch-and-hold = walk forward
  if(MOBILE){ const _go=document.querySelector('#splash .go'); if(_go) _go.textContent='Tap to begin'; }

  // ---------- renderer / scene / camera ----------
  const app = document.getElementById('app');
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  app.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000006);
  scene.fog = new THREE.FogExp2(0x000006, 0.0016);

  const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 5000);
  camera.rotation.order = 'YXZ';
  camera.position.set(0, EYE, 0);
  scene.add(camera);

  scene.add(new THREE.AmbientLight(0x2a3350, 0.6));
  const key = new THREE.DirectionalLight(0x8899cc, 0.5); key.position.set(3,10,2); scene.add(key);

  // ---------- starfield (you are floating in space) ----------
  (function stars(){
    const N = 3500, pos = new Float32Array(N*3);
    for(let i=0;i<N;i++){
      // random point on a shell
      const r = 700 + Math.random()*1600;
      const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
      pos[i*3]   = r*Math.sin(p)*Math.cos(t);
      pos[i*3+1] = r*Math.cos(p);
      pos[i*3+2] = r*Math.sin(p)*Math.sin(t);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    const m = new THREE.PointsMaterial({ color:0xffffff, size:2.2, sizeAttenuation:true, transparent:true, opacity:.9, depthWrite:false, fog:false });
    scene.add(new THREE.Points(g,m));
  })();

  // ---------- the paintable ground (invisible until painted) ----------
  const pc = document.createElement('canvas'); pc.width = pc.height = TEX;
  const pctx = pc.getContext('2d');
  pctx.clearRect(0,0,TEX,TEX);                 // fully transparent => void
  const paintTex = new THREE.CanvasTexture(pc);
  paintTex.anisotropy = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(GROUND, GROUND),
    new THREE.MeshBasicMaterial({ map:paintTex, transparent:true, depthWrite:false })
  );
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  // helper: uv -> canvas px
  function toPx(uv){ return { x: uv.x*TEX, y:(1-uv.y)*TEX }; }

  // spray a glowing splat (additive within the canvas so overlaps go white-hot).
  // dwell = how long you've lingered on one spot → paint pools & spatters (rewards a confident stroke).
  let lastPx=null, dwell=0;
  function spray(uv){
    const {x,y} = toPx(uv);
    if(lastPx){ const dd=Math.hypot(x-lastPx.x, y-lastPx.y);
      dwell = dd<18 ? Math.min(1, dwell+0.06) : Math.max(0, dwell-0.14); }
    lastPx={x,y};
    const col = new THREE.Color(COLORS[colorIdx]);
    const cr = (col.r*255)|0, cg=(col.g*255)|0, cb=(col.b*255)|0;
    pctx.globalCompositeOperation = 'lighter';
    const main = (32 + Math.random()*8) * (1 + dwell*0.9);   // pools outward when you linger
    const core = 0.55 + dwell*0.35;                          // brighter, wetter core on dwell
    const g = pctx.createRadialGradient(x,y,0, x,y,main);
    g.addColorStop(0,   `rgba(${cr},${cg},${cb},${core})`);
    g.addColorStop(0.5, `rgba(${cr},${cg},${cb},0.22)`);
    g.addColorStop(1,   `rgba(${cr},${cg},${cb},0)`);
    pctx.fillStyle = g;
    pctx.beginPath(); pctx.arc(x,y,main,0,7); pctx.fill();
    // scattered droplets => spray-can texture; more + further as it starts to run
    const drops = 6 + (dwell*12|0);
    for(let i=0;i<drops;i++){
      const a=Math.random()*7, d=Math.random()*main*(1.4+dwell*1.2), rr=1+Math.random()*(3+dwell*3);
      const dx=x+Math.cos(a)*d, dy=y+Math.sin(a)*d;
      pctx.fillStyle = `rgba(${cr},${cg},${cb},${0.14+Math.random()*0.28})`;
      pctx.beginPath(); pctx.arc(dx,dy,rr,0,7); pctx.fill();
    }
    pctx.globalCompositeOperation = 'source-over';
    paintTex.needsUpdate = true;
  }

  // ---------- a spray can (pickup + viewmodel) ----------
  function makeCan(scale){
    const g = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5,0.5,1.5,24),
      new THREE.MeshStandardMaterial({ color:0x14264a, roughness:.5, metalness:.3, emissive:0x0a1630, emissiveIntensity:.5 }));
    g.add(body);
    const band = new THREE.Mesh(
      new THREE.CylinderGeometry(0.505,0.505,0.5,24),
      new THREE.MeshStandardMaterial({ color:0x2f6bd0, roughness:.4, metalness:.3, emissive:0x1c3f7a, emissiveIntensity:.6 }));
    band.position.y = -0.15; g.add(band);
    const cap = new THREE.Mesh(
      new THREE.CylinderGeometry(0.34,0.42,0.5,20),
      new THREE.MeshStandardMaterial({ color:0x0c1424, roughness:.6 }));
    cap.position.y = 1.0; g.add(cap);
    const nozzle = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08,0.08,0.18,10),
      new THREE.MeshStandardMaterial({ color:0x05070c }));
    nozzle.position.y = 1.32; g.add(nozzle);
    g.scale.setScalar(scale||1);
    return g;
  }

  const canPickup = makeCan(1);
  canPickup.position.copy(CAN_POS);
  scene.add(canPickup);
  // soft glow ring under the can so you notice it in the void
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.9,1.25,32),
    new THREE.MeshBasicMaterial({ color:0x38e1ff, transparent:true, opacity:.35, side:THREE.DoubleSide, depthWrite:false }));
  ring.rotation.x = -Math.PI/2; ring.position.set(CAN_POS.x, 0.02, CAN_POS.z);
  scene.add(ring);

  let viewCan = null; // attached to camera once picked up

  // ---------- vending machine (procedural: open glass display, shelves, control panel, interior glow) ----------
  function makeLabel(w,h,draw){
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    draw(c.getContext('2d'),w,h);
    const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
  }
  function makeWD40(scale){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,1.5,20),
      new THREE.MeshStandardMaterial({color:0xf2c200,roughness:.5,metalness:.3,emissive:0x2a2400,emissiveIntensity:.4})));
    const band=new THREE.Mesh(new THREE.CylinderGeometry(0.425,0.425,0.4,20),
      new THREE.MeshStandardMaterial({color:0x1b3fa0,roughness:.4,emissive:0x0a1840,emissiveIntensity:.5}));
    band.position.y=0.18; g.add(band);
    const red=new THREE.Mesh(new THREE.CylinderGeometry(0.432,0.432,0.12,20),
      new THREE.MeshStandardMaterial({color:0xd83a2a,roughness:.5})); red.position.y=-0.35; g.add(red);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.36,0.4,16),
      new THREE.MeshStandardMaterial({color:0xdb2b1a,roughness:.6})); cap.position.y=0.95; g.add(cap);
    const straw=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.5,8),
      new THREE.MeshStandardMaterial({color:0xd83a2a})); straw.position.set(0.12,1.32,0); straw.rotation.z=-0.25; g.add(straw);
    g.scale.setScalar(scale||1); return g;
  }
  function makeVendingMachine(){
    const m=new THREE.Group();
    const CAB=0x16294d, PANELC=0x0c1830, SHELF=0x24406b;
    const cabMat=()=>new THREE.MeshStandardMaterial({color:CAB,roughness:.45,metalness:.35,emissive:0x081326,emissiveIntensity:.35});
    // cabinet frame (open front over the display bay)
    const back=new THREE.Mesh(new THREE.BoxGeometry(2.4,3.6,0.08),
      new THREE.MeshStandardMaterial({color:0x0a1c38,roughness:.6,emissive:0x123a66,emissiveIntensity:.5}));
    back.position.set(0,1.8,-0.46); m.add(back);
    const L=new THREE.Mesh(new THREE.BoxGeometry(0.1,3.6,1.0),cabMat()); L.position.set(-1.15,1.8,0); m.add(L);
    const R=new THREE.Mesh(new THREE.BoxGeometry(0.1,3.6,1.0),cabMat()); R.position.set(1.15,1.8,0); m.add(R);
    const T=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.14,1.0),cabMat()); T.position.set(0,3.53,0); m.add(T);
    const B=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.14,1.0),cabMat()); B.position.set(0,0.07,0); m.add(B);
    const DIV=new THREE.Mesh(new THREE.BoxGeometry(0.1,3.4,1.0),cabMat()); DIV.position.set(0.34,1.8,0); m.add(DIV);
    // ---- display bay (left): shelves + glass ----
    const DX=-0.42;
    const shelfMat=new THREE.MeshStandardMaterial({color:SHELF,roughness:.5,metalness:.4,emissive:0x08152b,emissiveIntensity:.3});
    const shelfYs=[1.1,2.3];
    shelfYs.forEach(sy=>{ const sh=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.05,0.6),shelfMat); sh.position.set(DX,sy,0.02); m.add(sh); });
    const glass=new THREE.Mesh(new THREE.PlaneGeometry(1.5,2.9),
      new THREE.MeshStandardMaterial({color:0x9fd0ff,transparent:true,opacity:0.12,roughness:.05,metalness:.1,emissive:0x2a5580,emissiveIntensity:.12,depthWrite:false}));
    glass.position.set(DX,1.95,0.48); m.add(glass);
    // ---- control panel (right) ----
    const PX=0.75;
    const face=new THREE.Mesh(new THREE.BoxGeometry(0.78,3.4,0.06),
      new THREE.MeshStandardMaterial({color:PANELC,roughness:.6,metalness:.3})); face.position.set(PX,1.8,0.46); m.add(face);
    const screenTex=makeLabel(256,128,(g,w,h)=>{ g.fillStyle='#03110a'; g.fillRect(0,0,w,h);
      g.fillStyle='#39ff88'; g.font='bold 70px monospace'; g.textAlign='center'; g.textBaseline='middle';
      g.shadowColor='#39ff88'; g.shadowBlur=18; g.fillText('10 X',w/2,h/2); });
    const screen=new THREE.Mesh(new THREE.PlaneGeometry(0.58,0.29),new THREE.MeshBasicMaterial({map:screenTex}));
    screen.position.set(PX,2.85,0.5); m.add(screen);
    const btnMat=new THREE.MeshStandardMaterial({color:0x2f6bd0,emissive:0x14356e,emissiveIntensity:.5,roughness:.5});
    for(let r=0;r<3;r++)for(let cc=0;cc<3;cc++){ const b=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.15,0.05),btnMat);
      b.position.set(PX-0.22+cc*0.22,2.35-r*0.22,0.5); m.add(b); }
    const slot=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.05,0.06),new THREE.MeshStandardMaterial({color:0x05070c}));
    slot.position.set(PX,1.55,0.5); m.add(slot);
    const bsvTex=makeLabel(160,120,(g,w,h)=>{ g.fillStyle='#0a0f1e'; g.fillRect(0,0,w,h);
      g.fillStyle='#f7931a'; g.font='bold 92px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('₿',w/2-16,h/2+2);
      g.fillStyle='#eaf2ff'; g.font='bold 30px sans-serif'; g.textAlign='left'; g.fillText('SV',w/2+16,h/2+14); });
    const bsv=new THREE.Mesh(new THREE.PlaneGeometry(0.42,0.3),new THREE.MeshBasicMaterial({map:bsvTex,transparent:true}));
    bsv.position.set(PX,1.15,0.5); m.add(bsv);
    // ---- header sign (glowing beacon) ----
    const headTex=makeLabel(1024,240,(g,w,h)=>{ g.fillStyle='#0a1730'; g.fillRect(0,0,w,h);
      g.textAlign='center'; g.textBaseline='middle';
      g.fillStyle='#eaf2ff'; g.font='bold 112px Georgia'; g.shadowColor='#6fb6ff'; g.shadowBlur=26; g.fillText('REFILL STATION',w/2,h/2-16);
      g.shadowBlur=0; g.fillStyle='#6fb6ff'; g.font='bold 34px sans-serif'; g.fillText('·  B I T G R A F  ·',w/2,h/2+72); });
    const header=new THREE.Mesh(new THREE.PlaneGeometry(2.3,0.54),new THREE.MeshBasicMaterial({map:headTex}));
    header.position.set(0,3.35,0.51); m.add(header);
    // ---- dispensing tray ----
    const tray=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.5,0.3),new THREE.MeshStandardMaterial({color:0x03060d,roughness:.85}));
    tray.position.set(0,0.55,0.36); m.add(tray);
    const lip=new THREE.Mesh(new THREE.BoxGeometry(2.05,0.06,0.12),new THREE.MeshStandardMaterial({color:SHELF,metalness:.4}));
    lip.position.set(0,0.83,0.5); m.add(lip);
    // ---- interior glow ----
    const glow=new THREE.PointLight(0x9fc4ff,7,5.5,2.0); glow.position.set(DX,2.0,0.1); m.add(glow);
    // ---- stock the shelves (MACHINE_STOCK; 0 = empty) ----
    let placed=0;
    for(let s=0;s<shelfYs.length && placed<MACHINE_STOCK;s++){
      const sy=shelfYs[s], perRow=Math.min(3, MACHINE_STOCK-placed);

      const buf = actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
      const d = buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      const src = actx.createBufferSource(); src.buffer=buf; src.loop=true;
      const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1900;
      const bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=5400; bp.Q.value=0.6;

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.04, t+0.006);

  function respond(text){
    const pad=' '+text.toLowerCase().replace(/[^a-z0-9'\s-]/g,' ').replace(/\s+/g,' ')+' ';

    return {reply:spin(FALLBACK), bye:false};
  }

  // ---------- loop ----------
  function tick(){
    const dt = Math.min(clock.getDelta(), 0.05);
    update(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
