<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grafverse — BMF atom lab</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;background:#05060d;overflow:hidden;font-family:system-ui,sans-serif;color:#eaf2ff}
  canvas{display:block}
  #hud{position:fixed;left:16px;top:14px;font-size:13px;line-height:1.5;color:#9fb4d8;pointer-events:none;text-shadow:0 1px 4px #000}
  #hud b{color:#eaf2ff}
  #spec{position:fixed;left:16px;bottom:14px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#7fd8ff;
        background:rgba(8,16,30,.6);padding:8px 12px;border-radius:8px;border:1px solid rgba(120,170,255,.2);max-width:72vw}
  #sw{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;align-items:center}
  .c{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer}
  .c.on{border-color:#fff;transform:scale(1.2)}
  #exp{position:fixed;right:16px;top:14px;padding:9px 16px;border-radius:20px;cursor:pointer;
       background:rgba(56,120,210,.9);border:1px solid rgba(140,190,255,.6);color:#eaf6ff;font:600 13px system-ui}
  #noz{position:fixed;right:16px;bottom:54px;display:flex;gap:6px}
  .n{padding:6px 11px;border-radius:14px;background:rgba(20,40,74,.9);border:1px solid rgba(120,170,255,.4);color:#cfe0ff;font:600 12px system-ui;cursor:pointer}
  .n.on{background:rgba(56,120,210,.95);border-color:#fff;color:#fff}
</style>
</head>
<body>
<div id="hud">
  <b>grafverse · BMF atom lab</b><br>
  drag empty — orbit &nbsp;·&nbsp; scroll — zoom (= spray distance)<br>
  drag on a shape — spray-paint &nbsp;·&nbsp; 1–5 — colour<br>
  close = tight but runs &nbsp;·&nbsp; far = wide splatter &nbsp;·&nbsp; linger = dribble
</div>
<div id="spec">paint a shape to see its atom spec — Export to size the data</div>
<button id="exp">Export paint</button>
<div id="noz"></div>
<div id="sw"></div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
  "use strict";
  if(!window.THREE){ document.getElementById('spec').textContent='vendor/three.min.js not found'; return; }
  const COLORS=[0x38e1ff,0xff3ea5,0x7CFC00,0xffe94d,0xff7a00];
  const NEAR=4.5, FAR=16;                  // spray-distance range (lab units ~ 0..1.11m)
  const NOZZLES=[
    {name:'skinny', r:20, spread:1.6, drip:true},   // tight, precise — can still run
    {name:'fat',    r:42, spread:2.6, drip:true},   // wide, fast fill
    {name:'fine',   r:15, spread:0.7, drip:false},  // dribble-free — fine art, no runs
  ];
  let nozIdx=1;
  let colorIdx=0;

  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);
  const el=renderer.domElement;

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x05060d);
  scene.add(new THREE.AmbientLight(0x445577,0.9));
  const key=new THREE.DirectionalLight(0xbcd0ff,0.7); key.position.set(4,8,6); scene.add(key);
  const rim=new THREE.DirectionalLight(0x2a3a66,0.5); rim.position.set(-5,2,-4); scene.add(rim);

  const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,200);
  const target=new THREE.Vector3(0,0.6,0);
  let theta=0.5, phi=1.15, radius=11;
  function updateCam(){ camera.position.set(
      target.x+radius*Math.sin(phi)*Math.sin(theta), target.y+radius*Math.cos(phi),
      target.z+radius*Math.sin(phi)*Math.cos(theta)); camera.lookAt(target); }
  updateCam();

  // ---------- shape kit ----------
  const TEX=1024;
  function paintCanvas(){ const c=document.createElement('canvas'); c.width=c.height=TEX; c.getContext('2d').clearRect(0,0,TEX,TEX); return c; }
  function coneDiskUV(geo,H){   // re-unwrap the cone SIDE as a disk (apex→centre): continuous, kills per-segment seams
    const g0=geo.groups[0], idx=geo.index, pos=geo.attributes.position, uv=geo.attributes.uv, done=new Set();
    for(let i=g0.start;i<g0.start+g0.count;i++){ const vi=idx.getX(i); if(done.has(vi))continue; done.add(vi);
      const x=pos.getX(vi),y=pos.getY(vi),z=pos.getZ(vi), t=(y+H/2)/H, a=Math.atan2(z,x), rho=(1-t)*0.49;
      uv.setXY(vi, 0.5+rho*Math.cos(a), 0.5+rho*Math.sin(a)); }
    uv.needsUpdate=true;
  }
  function geomFor(spec){ const p=spec.params||{};
    switch(spec.type){
      case 'plane':    return new THREE.PlaneGeometry(p.w||2, p.d||2).rotateX(-Math.PI/2);
      case 'wall':     return new THREE.PlaneGeometry(p.w||2, p.h||2.5);
      case 'box':      return new THREE.BoxGeometry(p.w||1.4, p.h||1.4, p.d||1.4);
      case 'cylinder': return new THREE.CylinderGeometry(p.r||0.7, p.r||0.7, p.h||1.8, 40);
      case 'sphere':   return new THREE.SphereGeometry(p.r||1, 40, 28);
      case 'cone':     { const cg=new THREE.ConeGeometry(p.r||0.9, p.h||1.8, 40); coneDiskUV(cg, p.h||1.8); return cg; }
    } return new THREE.BoxGeometry(1,1,1); }
  function buildAtom(spec){
    const geo=geomFor(spec);
    const hasGroups=geo.groups.length>0;
    const used=hasGroups?geo.groups.map(g=>g.materialIndex):[0];   // cone = [0,2], not [0,1]
    const maxMi=Math.max(0,...used);
    const surfaces=[], mats=[];
    for(let mi=0; mi<=maxMi; mi++){ const cvs=paintCanvas(), ctx=cvs.getContext('2d');   // index BY materialIndex
      const tex=new THREE.CanvasTexture(cvs); tex.anisotropy=4;
      surfaces[mi]={cvs,ctx,tex,strokes:[]};
      mats[mi]=new THREE.MeshStandardMaterial({ color:0x0c1526, transparent:true, opacity:0.5, roughness:.75,
        metalness:.1, emissive:0xffffff, emissiveMap:tex, emissiveIntensity:1.0, side:THREE.DoubleSide }); }
    const mesh=new THREE.Mesh(geo, hasGroups?mats:mats[0]);
    mesh.userData={ spec, surfaces, nUsed:new Set(used).size };
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,32),   // faint ghost wireframe — the "magical" latent-shape look
      new THREE.LineBasicMaterial({color:0x3a5688,transparent:true,opacity:0.5})));
    return mesh;
  }

  // ---------- spray: distance-driven cone + running drips ----------
  const drips=[];
  function rgb(i){ const c=new THREE.Color(COLORS[i]); return [c.r*255|0,c.g*255|0,c.b*255|0]; }
  // temporaries for angle-of-attack math
  const _n=new THREE.Vector3(),_rd=new THREE.Vector3(),_tU=new THREE.Vector3(),_tV=new THREE.Vector3(),_ip=new THREE.Vector3(),_wd=new THREE.Vector3();
  const _pA=new THREE.Vector3(),_pB=new THREE.Vector3(),_pC=new THREE.Vector3(),_e1=new THREE.Vector3(),_e2=new THREE.Vector3();
  function uvTangent(h,out){          // world direction of the surface's +U axis at the hit triangle
    const geo=h.object.geometry,pos=geo.attributes.position,uva=geo.attributes.uv,f=h.face;
    if(!uva||!f){ out.set(1,0,0); return out; }
    _pA.fromBufferAttribute(pos,f.a); _pB.fromBufferAttribute(pos,f.b); _pC.fromBufferAttribute(pos,f.c);
    const ua=uva.getX(f.a),va=uva.getY(f.a),ub=uva.getX(f.b),vb=uva.getY(f.b),uc=uva.getX(f.c),vc=uva.getY(f.c);
    _e1.copy(_pB).sub(_pA); _e2.copy(_pC).sub(_pA);
    const r=1/(((ub-ua)*(vc-va)-(uc-ua)*(vb-va))||1e-6);
    out.copy(_e1).multiplyScalar((vc-va)*r).addScaledVector(_e2,-(vb-va)*r);
    out.transformDirection(h.object.matrixWorld);
    if(out.lengthSq()<1e-8) out.set(1,0,0); else out.normalize();
    return out;
  }
  function spray(surface, h, dwell){
    const ctx=surface.ctx, uv=h.uv, x=uv.x*TEX, y=(1-uv.y)*TEX, N=NOZZLES[nozIdx];
    const dist=camera.position.distanceTo(h.point);
    _n.copy(h.face.normal).transformDirection(h.object.matrixWorld).normalize();
    _rd.copy(h.point).sub(camera.position).normalize();
    const inc=Math.min(1,Math.abs(_rd.dot(_n)));               // 1 head-on .. 0 grazing
    uvTangent(h,_tU); _tV.crossVectors(_n,_tU).normalize();    // surface U/V axes (world)
    _ip.copy(_rd).addScaledVector(_n,-_rd.dot(_n));            // spray dir projected onto the surface
    if(_ip.lengthSq()<1e-9) _ip.copy(_tU);
    _ip.normalize();
    let angle=Math.atan2(-_ip.dot(_tV), _ip.dot(_tU));         // stretch axis in canvas space
    let stretch=Math.min(2.4, 1/Math.max(inc,0.4));           // grazing → elongated ellipse (softened for curves)
    if(!isFinite(angle)) angle=0; if(!isFinite(stretch)||stretch<1) stretch=1;
    const dn=Math.max(0,Math.min(1,(dist-NEAR)/(FAR-NEAR)));
    const R=N.r*(0.55+dn*N.spread), core=0.62*(1-dn*0.6)/Math.sqrt(stretch);   // stretched = thinner coverage
    const [cr,cg,cb]=rgb(colorIdx);
    ctx.globalCompositeOperation='lighter';
    ctx.save(); ctx.translate(x,y); ctx.rotate(angle); ctx.scale(stretch,1);
    const g=ctx.createRadialGradient(0,0,0,0,0,R);
    g.addColorStop(0,`rgba(${cr},${cg},${cb},${core})`); g.addColorStop(0.5,`rgba(${cr},${cg},${cb},${core*0.35})`); g.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill(); ctx.restore();
    const drops=((4+(dn*44|0))*(N.spread/2.6))|0, ca=Math.cos(angle), sa=Math.sin(angle);
    for(let i=0;i<drops;i++){ const a=Math.random()*7, base=Math.random()*R*(1.1+dn*1.6);
      const ox=Math.cos(a)*base*stretch, oy=Math.sin(a)*base, rr=1+Math.random()*(2+dn*4);   // fling further along grazing axis
      ctx.fillStyle=`rgba(${cr},${cg},${cb},${(0.10+Math.random()*0.22)*(1-dn*0.4)})`;
      ctx.beginPath(); ctx.arc(x+ox*ca-oy*sa, y+ox*sa+oy*ca, rr, 0,7); ctx.fill(); }
    ctx.globalCompositeOperation='source-over';
    surface.tex.needsUpdate=true;
    if(N.drip){ const vertical=Math.abs(_n.y)<0.55, run=(1-dn)*dwell;
      if(vertical && run>0.55 && Math.random()<0.14){
        _wd.set(0,-1,0).addScaledVector(_n,_n.y);         // world-down projected onto the surface
        let dcx=0,dcy=1;
        if(_wd.lengthSq()>1e-6){ _wd.normalize(); const du=_wd.dot(_tU),dv=_wd.dot(_tV),dl=Math.hypot(du,dv)||1; dcx=du/dl; dcy=-dv/dl; }
        drips.push({surface, x, y, dx:dcx, dy:dcy, len:0, maxLen:30+Math.random()*140, w:2.5+Math.random()*4.5, col:colorIdx}); } }
  }
  function stepDrips(){
    for(let i=drips.length-1;i>=0;i--){ const d=drips[i], ctx=d.surface.ctx, c=rgb(d.col);
      ctx.globalCompositeOperation='lighter';
      if(d.len<d.maxLen){ const nl=Math.min(d.maxLen,d.len+2.6);
        ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},0.5)`; ctx.lineWidth=d.w; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(d.x+d.dx*d.len, d.y+d.dy*d.len); ctx.lineTo(d.x+d.dx*nl, d.y+d.dy*nl); ctx.stroke();
        d.len=nl;
      } else { ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},0.55)`;
        ctx.beginPath(); ctx.arc(d.x+d.dx*d.len, d.y+d.dy*d.len, d.w*0.95,0,7); ctx.fill(); drips.splice(i,1); }
      ctx.globalCompositeOperation='source-over'; d.surface.tex.needsUpdate=true;
    }
  }

  // ---------- stroke recording ----------
  let cur=null;
  function startStroke(h){
    const si=h.face.materialIndex||0;
    cur={ atom:h.object, si, surface:h.object.userData.surfaces[si], t0:performance.now(),
          dwell:0, lu:null, lv:null, stroke:{ b:'solid', noz:NOZZLES[nozIdx].name, c:colorIdx, s:NOZZLES[nozIdx].r, pts:[] } };
    addPoint(h);
  }
  function addPoint(h){
    if(!cur) return;
    const uv=h.uv;
    const moved=cur.lu!=null?Math.hypot(uv.x-cur.lu,uv.y-cur.lv):1;
    cur.dwell = moved<0.012 ? Math.min(1,cur.dwell+0.09) : Math.max(0,cur.dwell-0.16);
    spray(cur.surface, h, cur.dwell);
    const pts=cur.stroke.pts;
    if(pts.length && moved<0.006) return;                     // decimate near-duplicates
    pts.push([ +uv.x.toFixed(3), +uv.y.toFixed(3), Math.round(performance.now()-cur.t0) ]);
    cur.lu=uv.x; cur.lv=uv.y;
  }
  function simplify(pts, eps){
    if(pts.length<3) return pts;
    const keep=new Array(pts.length).fill(false); keep[0]=keep[pts.length-1]=true; const stack=[[0,pts.length-1]];
    while(stack.length){ const s=stack.pop(),a=s[0],b=s[1],ax=pts[a][0],ay=pts[a][1],dx=pts[b][0]-ax,dy=pts[b][1]-ay,l2=dx*dx+dy*dy||1e-9;
      let md=0,idx=-1; for(let i=a+1;i<b;i++){ const px=pts[i][0],py=pts[i][1],tt=((px-ax)*dx+(py-ay)*dy)/l2,cx=ax+tt*dx,cy=ay+tt*dy,dd=Math.hypot(px-cx,py-cy); if(dd>md){md=dd;idx=i;} }
      if(md>eps&&idx>0){ keep[idx]=true; stack.push([a,idx]); stack.push([idx,b]); } }
    return pts.filter((_,i)=>keep[i]);
  }
  function endStroke(){ if(cur&&cur.stroke.pts.length){ cur.stroke.pts=simplify(cur.stroke.pts,0.009); cur.surface.strokes.push(cur.stroke); } cur=null; }

  // ---------- atoms ----------
  const SPECS=[
    {bmf:'shape',v:1,type:'plane',   params:{w:2.2,d:2.2}},
    {bmf:'shape',v:1,type:'wall',    params:{w:2.2,h:2.6}},
    {bmf:'shape',v:1,type:'box',     params:{w:1.5,h:1.5,d:1.5}},
    {bmf:'shape',v:1,type:'cylinder',params:{r:0.75,h:1.9}},
    {bmf:'shape',v:1,type:'sphere',  params:{r:0.95}},
    {bmf:'shape',v:1,type:'cone',    params:{r:0.95,h:1.9}},
  ];
  const atoms=[]; const N=SPECS.length, GAP=3.4;
  SPECS.forEach((spec,i)=>{ const m=buildAtom(spec);
    m.position.set((i-(N-1)/2)*GAP, spec.type==='plane'?0.02:1.05, 0); scene.add(m); atoms.push(m); });

  // ---------- input ----------
  const ray=new THREE.Raycaster(); const ndc=new THREE.Vector2();
  let mode=null, lastX=0, lastY=0;
  function hit(cx,cy){ ndc.set((cx/innerWidth)*2-1,-(cy/innerHeight)*2+1); ray.setFromCamera(ndc,camera); return ray.intersectObjects(atoms,false)[0]||null; }
  function showSpec(mesh){ const u=mesh.userData,nS=u.nUsed; document.getElementById('spec').textContent=JSON.stringify(u.spec)+'  ·  '+nS+' surface'+(nS>1?'s':''); }
  function down(cx,cy){ const h=hit(cx,cy); if(h){ mode='paint'; showSpec(h.object); startStroke(h); } else mode='orbit'; lastX=cx; lastY=cy; }
  function move(cx,cy){
    if(mode==='orbit'){ theta-=(cx-lastX)*0.006; phi-=(cy-lastY)*0.006; phi=Math.max(0.15,Math.min(Math.PI-0.15,phi)); updateCam(); }
    else if(mode==='paint'&&cur){ const h=hit(cx,cy); if(h&&h.object===cur.atom&&(h.face.materialIndex||0)===cur.si) addPoint(h); }
    lastX=cx; lastY=cy;
  }
  function up(){ if(mode==='paint') endStroke(); mode=null; }
  el.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
  addEventListener('mousemove',e=>{ if(mode) move(e.clientX,e.clientY); });
  addEventListener('mouseup',up);
  el.addEventListener('wheel',e=>{ e.preventDefault(); radius=Math.max(4,Math.min(30,radius+e.deltaY*0.01)); updateCam(); },{passive:false});
  el.addEventListener('touchstart',e=>{ const t=e.touches[0]; down(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
  el.addEventListener('touchmove',e=>{ const t=e.touches[0]; if(mode) move(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
  el.addEventListener('touchend',up);
  addEventListener('keydown',e=>{ if(e.code>='Digit1'&&e.code<='Digit5'){ colorIdx=+e.code.slice(5)-1; paintSwatches(); }});

  // ---------- export ----------
  async function gzipSize(str){ if(!self.CompressionStream) return null;
    const cs=new CompressionStream('gzip'), w=cs.writable.getWriter(); w.write(new TextEncoder().encode(str)); w.close();
    return (await new Response(cs.readable).arrayBuffer()).byteLength; }
  async function exportPaint(){
    const out={bmf:'scene',v:1,atoms:[]}; let sc=0,pc=0;
    atoms.forEach(m=>{ const paint=[]; m.userData.surfaces.forEach((s,i)=>{ if(s.strokes.length){ paint.push({surf:i,strokes:s.strokes}); sc+=s.strokes.length; s.strokes.forEach(st=>pc+=st.pts.length); } });
      if(paint.length) out.atoms.push({type:m.userData.spec.type,params:m.userData.spec.params,paint}); });
    const json=JSON.stringify(out), bytes=new TextEncoder().encode(json).length, gz=await gzipSize(json);
    document.getElementById('spec').textContent=`${out.atoms.length} atom(s) · ${sc} strokes · ${pc} pts  →  ${bytes} B raw`+(gz!=null?` · ${gz} B gzip`:'');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download='grafverse-paint.json'; a.click(); URL.revokeObjectURL(a.href);
    console.log(out);
  }
  document.getElementById('exp').addEventListener('click',exportPaint);

  const sw=document.getElementById('sw');
  function paintSwatches(){ sw.innerHTML=''; COLORS.forEach((c,i)=>{ const d=document.createElement('div'); d.className='c'+(i===colorIdx?' on':''); d.style.background='#'+c.toString(16).padStart(6,'0'); d.onclick=()=>{colorIdx=i;paintSwatches();}; sw.appendChild(d); }); }
  paintSwatches();

  const nozEl=document.getElementById('noz');
  function paintNoz(){ nozEl.innerHTML=''; NOZZLES.forEach((n,i)=>{ const d=document.createElement('div'); d.className='n'+(i===nozIdx?' on':''); d.textContent=n.name; d.onclick=()=>{nozIdx=i;paintNoz();}; nozEl.appendChild(d); }); }
  paintNoz();

  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  (function loop(){ stepDrips(); renderer.render(scene,camera); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
